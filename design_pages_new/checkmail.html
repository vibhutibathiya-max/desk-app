<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- BOOTSTRAP CSS LINK -->
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css.map">
    <!-- FONT AWESOME LINK -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">
    
</head>
<body>
    <!-- MAIN CONTAINER :: STARTS -->
    <div class="login-content">
         <!-- LOGIN CONTENT :: STARTS -->
         <div class="login-left-section">
            <div class="logo">
                <img src="../assets/img-new/logo-color.svg" alt="LOGO" width="" height="">
            </div>
            <div class="check-mail-content">
                <h3 class="heading">Check your email</h3>
                <p class="sub-heading">We have sent password recovery instructions
                    to your Email address</p>
                    <button type="button" class="gradient-btn">Back to Login</button>
            </div>
        </div>

        <!-- LOGIN CONTENT :: ENDS -->
        <!-- RIGHTSIDE CONTENT :: STARTS -->
        <div class="login-right-section check-mail">
            <img src="../public/app-icon/logo/logo-white.svg" alt="LOGO" width="" height="" onerror="(function(m){m=m.dataset;var f=+m.s||0,b=['../assets/img-new/logo-white.svg','../assets/img-new/trago-white.svg'];if(b[f]!==void 0){m.s=f+1;this.src=b[f];}else{this.onerror=null;}})(this)">
            <p class="version">Version 3.0</p>
            <img src="../public/app-icon/icon/light/check-mail.svg" alt="CHECK MAIL" height="" width="" onerror="if(!this.dataset.cm){this.dataset.cm=1;this.src='../assets/img-new/check-mail.svg';}else{this.onerror=null;}">
        </div>
        <!-- RIGHTSIDE CONTENT :: ENDS -->
    </div>
    <!-- MAIN CONTAINER :: ENDS -->
    <!-- Match Icon / Logo gallery preview (colors + localStorage assets) -->
    <script src="js/icon-gallery-preview-bridge.js" type="text/javascript"></script>
    <script src="js/gallery-preview-assets.js" type="text/javascript"></script>
    <!-- BOOTSTRAP JS LINK -->
    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>

</body>
</html>
