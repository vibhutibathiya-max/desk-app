<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tragofone — mobile communications app" />
    <meta name="theme-color" content="#6533e2" />
    <title>Tragofone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/page.css" />
  </head>
  <body>
    <main
      class="app-screen app-screen--brand splash"
      role="main"
      aria-busy="true"
      aria-labelledby="splash-title"
    >
      <h1 id="splash-title" class="visually-hidden">Tragofone is loading</h1>

      <div class="app-screen__corner" aria-hidden="true">
        <span class="app-badge">
          <img
            class="app-badge__icon"
            src="assets/icons/app-badge.svg"
            alt=""
            width="24"
            height="24"
          />
        </span>
      </div>

      <div class="app-screen__body">
        <img
          class="brand-logo"
          src="assets/images/logo-mark.png"
          alt=""
          width="160"
          height="160"
          decoding="async"
          fetchpriority="high"
          aria-hidden="true"
        />
      </div>

      <footer class="app-screen__footer">
        <img
          class="brand-wordmark"
          src="assets/images/wordmark.png"
          alt="Tragofone"
          width="200"
          height="32"
          decoding="async"
        />
      </footer>
    </main>
  </body>
</html>
