<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Icon Gallery “Shared” color sync: open the project root (desk-app) in Live Server / your preview so /public/... and localStorage are shared. -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- BOOTSTRAP CSS LINK -->
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <!-- FONT AWESOME LINK -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">
    <script src="../assets/js/icon-svg-inline.js"></script>
</head>
<body>
    <!-- MAIN CONTAINER :: STARTS -->
    <div class="login-content">
         <!-- LOGIN CONTENT :: STARTS -->
         <div class="login-left-section">
            <div class="logo">
                <img src="../assets/img-new/logo-color.svg" alt="LOGO" width="" height="">
            </div>
            <div class="check-mail-content">
                <h3 class="heading">Check your email</h3>
                <p class="sub-heading">We have sent password recovery instructions
                    to your Email address</p>
                    <button type="button" class="gradient-btn">Back to Login</button>
            </div>
        </div>

        <!-- LOGIN CONTENT :: ENDS -->
        <!-- RIGHTSIDE CONTENT :: STARTS -->
        <div class="login-right-section check-mail">
            <img src="../public/app-icon/logo/logo-white.svg" alt="LOGO" width="" height="">
            <p class="version">Version 3.0</p>
            <!-- Must match icon-gallery: ICON_PATH_LIGHT + 'check-mail.svg' (shared-gradient / preview-asset:icon-light:check-mail.svg) -->
            <img class="js-icon-bridge-mail" id="checkMailHeroIcon" alt="CHECK MAIL" width="" height=""
                 data-icon-slot="check-mail.svg" data-icon-theme="light"
                 data-gallery-src-original="../public/app-icon/icon/light/check-mail.svg"
                 src="../public/app-icon/icon/light/check-mail.svg">
        </div>
        <!-- RIGHTSIDE CONTENT :: ENDS -->
    </div>
    <!-- MAIN CONTAINER :: ENDS -->
    <!-- BOOTSTRAP JS LINK -->
    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>

</body>
</html>
