<!-- Splash -->
<section
  class="screen-panel screen-panel--active splash"
  data-screen="splash"
  aria-label="Splash screen"
>
  <main
    class="app-screen app-screen--brand"
    role="main"
    aria-busy="true"
    aria-labelledby="splash-title"
  >
    <h1 id="splash-title" class="visually-hidden">Tragofone is loading</h1>

    <div class="app-screen__corner" aria-hidden="true">
      <span class="app-badge">
        <img
          class="app-badge__icon"
          data-asset-key="APP_BADGE"
          src="assets/icons/app-badge.svg"
          alt=""
          width="24"
          height="24"
        />
      </span>
    </div>

    <div class="app-screen__body">
      <img
        class="brand-logo"
        data-asset-key="SPLASH_LOGO"
        src="assets/images/brand-icon.png"
        alt=""
        width="160"
        height="160"
        decoding="async"
        fetchpriority="high"
        aria-hidden="true"
      />
    </div>

    <footer class="app-screen__footer">
      <img
        class="brand-wordmark"
        data-asset-key="SPLASH_WORDMARK"
        src="assets/images/brand-wordmark.png"
        alt="Tragofone"
        width="200"
        height="32"
        decoding="async"
      />
    </footer>
  </main>
</section>
