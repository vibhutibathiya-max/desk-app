<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        
        .page-layout { display: flex; flex-direction: column; min-height: 100vh; }
        
        .header-bar {
            background: #16213e; border-bottom: 1px solid #0f3460;
            padding: 16px 24px; flex-shrink: 0; display: flex; align-items: center; gap: 16px;
        }
        .header-bar h1 { font-size: 18px; color: #8ecae6; font-weight: 600; }
        
        .btn { padding: 10px 20px; font-size: 13px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: linear-gradient(270deg, #6533e2, #1f97ef); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: #0f3460; color: #8ecae6; }
        .btn-secondary:hover { background: #1a4a6e; }
        
        input[type="file"] { display: none; }
        
        .preview-section { flex: 1; padding: 24px; overflow-y: auto; background: #0d0d1a; }
        .preview-section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8ecae6; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #0f3460; }
        
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .icon-card {
            background: #16213e; border: 1px solid #0f3460; border-radius: 8px;
            overflow: hidden; transition: border-color 0.2s;
        }
        .icon-card:hover { border-color: #8ecae6; }
        
        .icon-preview-row { display: flex; min-height: 90px; }
        .icon-preview-swatch {
            flex: 1; padding: 12px; display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid #0f3460;
        }
        .icon-preview-swatch.light { background: #f5f5f5; }
        .icon-preview-swatch.dark { background: #0d0d1a; border-left: 1px solid #0f3460; }
        .icon-preview-swatch img { max-width: 56px; max-height: 56px; object-fit: contain; }
        
        .icon-info { padding: 12px 16px; font-size: 12px; color: #e0e0e0; }
        .icon-info .name { font-weight: 600; color: #fff; margin-bottom: 8px; word-break: break-all; }
        
        .icon-colors { margin-top: 10px; padding-top: 10px; border-top: 1px solid #0f3460; }
        .icon-colors summary { cursor: pointer; color: #8ecae6; font-size: 11px; }
        .icon-colors summary:hover { text-decoration: underline; }
        .icon-colors[open] summary { margin-bottom: 8px; }
        .color-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; }
        .color-row label { flex: 0 0 90px; color: #aaa; }
        .color-swatch-wrap { position: relative; display: block; flex-shrink: 0; width: 40px; height: 36px; cursor: pointer; border-radius: 6px; overflow: hidden; border: 2px solid #0f3460; }
        .color-swatch-wrap:hover { border-color: #8ecae6; }
        .color-swatch-wrap .color-swatch-bg { position: absolute; inset: 0; border-radius: 4px; }
        .color-swatch-wrap input[type="color"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; padding: 0; border: none; }
        .color-row input[type="text"] { flex: 1; min-width: 0; padding: 6px 8px; font-size: 11px; background: #0f3460; border: 1px solid #0f3460; color: #fff; border-radius: 4px; }
        .color-row .var-tag { font-size: 9px; color: #666; }
        
        .icon-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .icon-actions .btn { padding: 6px 12px; font-size: 11px; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .empty-state p { margin-top: 12px; font-size: 14px; }
        
        .no-colors-hint { font-size: 10px; color: #666; margin-top: 6px; }
        .icon-card.shared-gradient-card { grid-column: 1 / -1; width: 100%; }
        .shared-preview-strip {
            display: flex; flex-direction: row; flex-wrap: wrap; gap: 20px 24px;
            margin-bottom: 24px; padding: 20px 0; width: 100%;
        }
        .shared-icon-cell {
            flex: 1 1 calc(20% - 20px); min-width: 140px; display: flex; flex-direction: column; gap: 10px; padding: 16px;
            background: #0f3460; border-radius: 8px; border: 1px solid #1a4a6e;
        }
        .shared-icon-cell .icon-name { font-size: 11px; color: #8ecae6; word-break: break-all; text-align: center; font-weight: 500; }
        .shared-icon-cell .preview-pair {
            display: flex; gap: 10px; align-items: stretch; min-height: 90px;
        }
        .shared-icon-cell .preview-pair .mini-preview {
            flex: 1; min-width: 70px; height: 90px; border-radius: 6px; overflow: hidden; border: 1px solid #1a4a6e;
            display: flex; align-items: center; justify-content: center;
        }
        .shared-icon-cell .preview-pair .mini-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .shared-icon-cell .preview-pair .mini-preview.light { background: #f5f5f5; }
        .shared-icon-cell .preview-pair .mini-preview.dark { background: #0d0d1a; }
        .icon-card.shared-gradient-card .icon-info { padding: 16px 20px; }
    </style>
</head>
<body>
    <div class="page-layout">
        <header class="header-bar">
            <h1>Icon Gallery</h1>
            <button class="btn btn-primary" id="btnDownloadIcons">Download Icons (icon.zip)</button>
            <button class="btn btn-secondary" id="btnResetAll">Reset All</button>
        </header>
        
        <script src="../assets/js/jszip.js"></script>
        <section class="preview-section">
            <h2>Icons – 1 icon = 1 box, each icon 1 time (no repeat)</h2>
            <p style="font-size:12px;color:#888;margin-bottom:16px;line-height:1.5">
                One box per icon. Each icon appears once. All colors in that box – one control per unique color. Change any color → preview updates live.
            </p>
            <div id="iconGrid" class="icon-grid"></div>
            <div id="emptyState" class="empty-state">
                <p>Loading icons…</p>
            </div>
        </section>
    </div>
    
    <script>
        const ICON_FILES = [
            'done.svg', 'logout.svg', 'autoStartup.svg', 'blind-trasferred.svg', 're-register.svg',
            'clear-history.svg', 'export-icon.svg', 'import-icon.svg', 'web-socket-connection.svg',
            'api-test-connection.svg', 'sip-configuration.svg',
            'no-calls-found.svg', 'no-favoritecontact-found.svg',
            'qr-vector.svg', 'check-mail.svg', 'cloud-contact-banner.svg', 'start-chat.svg', 'no-contacts-found.svg'
        ];
        const SHARED_GRADIENT_ICONS = ICON_FILES.slice(0, 10);
        const SHARED_GRADIENT_COLORS_LIGHT = [
            { id: '#6533E2', label: 'Gradient 1', default: '#6533E2' },
            { id: '#7349DE', label: 'Gradient 2', default: '#7349DE' },
            { id: '#1F97EF', label: 'Gradient 3', default: '#1F97EF' },
            { id: '#57A1D7', label: 'Gradient 4', default: '#57A1D7' },
            { id: '#E8DFFF', label: 'Background circle (light theme)', default: '#E8DFFF' },
            { id: '#614B98', label: 'Background circle (light theme)', default: '#614B98' }
        ];
        const SHARED_GRADIENT_COLORS_DARK = [
            { id: '#6533E2', label: 'Gradient 1', default: '#6533E2' },
            { id: '#7349DE', label: 'Gradient 2', default: '#7349DE' },
            { id: '#1F97EF', label: 'Gradient 3', default: '#1F97EF' },
            { id: '#57A1D7', label: 'Gradient 4', default: '#57A1D7' },
            { id: '#D9D9D9', label: 'Background circle (dark theme)', default: '#D9D9D9' }
        ];
        const SHARED_GRADIENT_COLORS = [
            { id: '#6533E2', label: 'Gradient 1', default: '#6533E2' },
            { id: '#7349DE', label: 'Gradient 2', default: '#7349DE' },
            { id: '#1F97EF', label: 'Gradient 3', default: '#1F97EF' },
            { id: '#57A1D7', label: 'Gradient 4', default: '#57A1D7' },
            { id: '#E8DFFF', label: 'Bg circle — done/re-register (light theme)', default: '#E8DFFF' },
            { id: '#614B98', label: 'Bg circle — web-socket/api-test (light theme)', default: '#614B98' },
            { id: '#D9D9D9', label: 'all icon (dark theme)', default: '#D9D9D9' }
        ];
        const SHARED_GRADIENT_KEY = 'shared-gradient';
        const ICON_PATH_LIGHT = '../public/app-icon/icon/light/';
        const ICON_PATH_DARK = '../public/app-icon/icon/dark/';
        const PREVIEW_PREFIX_LIGHT = 'preview-asset:icon-light:';
        const PREVIEW_PREFIX_DARK = 'preview-asset:icon-dark:';
        const COLORS_PREFIX = 'whitelabel-icon-colors:';
        
        const ICON_TO_PAGE = {
            'blind-trasferred.svg': 'call_connecting.html#blindTransferModal',
            're-register.svg': 'setting.html#pills-reRegister',
            'done.svg': 'setting.html',
            'api-test-connection.svg': 'setting.html',
            'web-socket-connection.svg': 'setting.html',
            'autoStartup.svg': 'autostartup.html'
        };

        let icons = [];
        const svgCache = {};
        const colorConfigCache = {};
        
        function toHex6(hex) {
            if (!hex || !/^#?([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/.test(String(hex).trim())) return null;
            let h = String(hex).trim().replace(/^#/, '');
            if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
            return '#' + h.toLowerCase();
        }
        /** For input[type="color"]: value must be #rrggbb lowercase. Returns valid value or fallback. */
        function toColorInputValue(hex, fallback) {
            const v = toHex6(hex);
            return (v && /^#[0-9a-f]{6}$/.test(v)) ? v : (toHex6(fallback) || '#000000');
        }
        
        function getStoredColors(filename) {
            const key = SHARED_GRADIENT_ICONS.includes(filename) ? SHARED_GRADIENT_KEY : filename;
            try {
                const raw = localStorage.getItem(COLORS_PREFIX + key);
                if (!raw) return {};
                const parsed = JSON.parse(raw);
                return typeof parsed === 'object' && parsed !== null ? parsed : {};
            } catch (e) { return {}; }
        }
        
        function setStoredColors(filename, obj) {
            const key = SHARED_GRADIENT_ICONS.includes(filename) ? SHARED_GRADIENT_KEY : filename;
            localStorage.setItem(COLORS_PREFIX + key, JSON.stringify(obj));
        }
        
        /** Extract unique hex colors from SVG. One box per icon, one control per color – no repeats. */
        function parseSvgColors(svgText) {
            const byHex = new Map();
            function add(hex) {
                const h = toHex6(hex);
                if (!h || byHex.has(h.toLowerCase())) return;
                byHex.set(h.toLowerCase(), { id: h, default: h });
            }
            const stopRe = /stop-color\s*=\s*["']?#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})(?![0-9A-Fa-f])/gi;
            let m;
            while ((m = stopRe.exec(svgText)) !== null) add('#' + m[1]);
            const fillRe = /fill\s*=\s*["']#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})(?![0-9A-Fa-f])/gi;
            while ((m = fillRe.exec(svgText)) !== null) add('#' + m[1]);
            const strokeRe = /stroke\s*=\s*["']#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})(?![0-9A-Fa-f])/gi;
            while ((m = strokeRe.exec(svgText)) !== null) add('#' + m[1]);
            if (byHex.size === 0) return null;
            const colors = Array.from(byHex.values()).map((c, i) => ({
                id: c.id,
                label: 'Color ' + (i + 1) + ' ' + c.default,
                default: c.default,
                replace: [c.default]
            }));
            return { colors };
        }
        
        function getColorValue(colorValues, slotId) {
            if (colorValues[slotId] !== undefined && colorValues[slotId] !== null) return colorValues[slotId];
            const lower = String(slotId).toLowerCase();
            for (const k of Object.keys(colorValues || {})) {
                if (String(k).toLowerCase() === lower) return colorValues[k];
            }
            return undefined;
        }
        
        function applySvgColors(svgText, colorConfig, colorValues) {
            if (!svgText || !colorConfig?.colors) return svgText;
            let out = svgText;
            colorConfig.colors.forEach(slot => {
                const val = getColorValue(colorValues, slot.id);
                const hex = val ? toHex6(val) : toHex6(slot.default);
                if (!hex) return;
                const toReplace = slot.replace || [slot.id];
                toReplace.forEach(oldHex => {
                    const escaped = String(oldHex).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const re = new RegExp(escaped, 'gi');
                    out = out.replace(re, hex);
                });
            });
            return out;
        }
        
        async function fetchSvgText(url) {
            if (svgCache[url]) return svgCache[url];
            try {
                const r = await fetch(url);
                if (r.ok) {
                    const t = await r.text();
                    svgCache[url] = t;
                    return t;
                }
            } catch (e) {}
            return '';
        }
        
        function svgToBlobUrl(svgText) {
            if (!svgText) return '';
            const blob = new Blob([svgText], { type: 'image/svg+xml' });
            return URL.createObjectURL(blob);
        }
        
        function getReplacePatterns(hexId) {
            const h = String(hexId);
            const lower = h.toLowerCase();
            return h === lower ? [h] : [h, lower];
        }
        
        async function getIconColorConfig(filename, mode) {
            if (SHARED_GRADIENT_ICONS.includes(filename)) {
                const modeColors = mode === 'dark' ? SHARED_GRADIENT_COLORS_DARK : SHARED_GRADIENT_COLORS_LIGHT;
                return { colors: modeColors.map(c => ({ ...c, replace: getReplacePatterns(c.id) })) };
            }
            const cacheKey = filename;
            if (colorConfigCache[cacheKey]) return colorConfigCache[cacheKey];
            const prefix = mode === 'light' ? PREVIEW_PREFIX_LIGHT : PREVIEW_PREFIX_DARK;
            const stored = localStorage.getItem(prefix + filename);
            let svgText = '';
            if (stored && stored.startsWith('data:')) {
                svgText = dataUrlToSvgText(stored);
            } else {
                const path = mode === 'light' ? ICON_PATH_LIGHT : ICON_PATH_DARK;
                svgText = await fetchSvgText(path + filename);
            }
            const config = svgText ? parseSvgColors(svgText) : null;
            colorConfigCache[cacheKey] = config;
            return config;
        }
        
        async function getPreviewUrl(filename, mode, colorValues) {
            const prefix = mode === 'light' ? PREVIEW_PREFIX_LIGHT : PREVIEW_PREFIX_DARK;
            const stored = localStorage.getItem(prefix + filename);
            if (stored && stored.startsWith('data:')) return stored;
            const path = mode === 'light' ? ICON_PATH_LIGHT : ICON_PATH_DARK;
            const url = path + filename;
            let svgText = await fetchSvgText(url);
            if (!svgText) return path + filename;
            const config = await getIconColorConfig(filename, mode);
            if (config) {
                const values = { ...getDefaults(config), ...colorValues };
                svgText = applySvgColors(svgText, config, values);
            }
            return svgToBlobUrl(svgText) || url;
        }
        
        function getDefaults(config) {
            const o = {};
            (config?.colors || []).forEach(c => { o[c.id] = c.default; });
            return o;
        }
        
        function addIcon(data) {
            icons.push(data);
            renderGrid();
        }
        
        function updateIcon(index, data) {
            const icon = icons[index];
            if (icon?.lightSrc?.startsWith('blob:')) URL.revokeObjectURL(icon.lightSrc);
            if (icon?.darkSrc?.startsWith('blob:')) URL.revokeObjectURL(icon.darkSrc);
            icons[index] = { ...icons[index], ...data };
            renderGrid();
        }
        
        function loadOneIcon(filename, mode, onDone) {
            const path = mode === 'light' ? ICON_PATH_LIGHT : ICON_PATH_DARK;
            tryLoadIcon(path + filename, (u) => onDone(mode, u), () => onDone(mode, ''));
        }
        
        function tryLoadIcon(url, onSuccess, onFail) {
            const img = new Image();
            img.onload = () => onSuccess(url, img);
            img.onerror = () => onFail();
            img.src = url;
        }
        
        let renderGridTimer = 0;
        function scheduleRenderGrid() {
            if (renderGridTimer) clearTimeout(renderGridTimer);
            renderGridTimer = setTimeout(() => { renderGridTimer = 0; renderGrid(); }, 50);
        }
        
        function loadIconPair(filename) {
            const icon = icons.find(i => i.name === filename);
            if (!icon) return;
            let done = 0;
            const check = (mode, url) => {
                if (mode === 'light') icon.lightSrc = url || ICON_PATH_LIGHT + filename;
                else icon.darkSrc = url || ICON_PATH_DARK + filename;
                done++;
                if (done === 2) scheduleRenderGrid();
            };
            loadOneIcon(filename, 'light', check);
            loadOneIcon(filename, 'dark', check);
        }
        
        function loadBuiltInIcons() {
            icons = ICON_FILES.map(name => ({ name, lightSrc: ICON_PATH_LIGHT + name, darkSrc: ICON_PATH_DARK + name }));
            ICON_FILES.forEach(loadIconPair);
        }
        
        const EMPTY_IMG = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
        
        async function renderGrid() {
            icons = icons.filter((i, idx, arr) => arr.findIndex(x => x.name === i.name) === idx);
            const grid = document.getElementById('iconGrid');
            const empty = document.getElementById('emptyState');
            grid.innerHTML = '';
            const esc = (s) => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            
            const sharedColorValues = getStoredColors(SHARED_GRADIENT_ICONS[0]);
            const sharedPreviewHtml = await (async () => {
                let html = '<div class="shared-preview-strip">';
                for (const name of SHARED_GRADIENT_ICONS) {
                    const icon = icons.find(i => i.name === name);
                    let lightSrc = EMPTY_IMG, darkSrc = EMPTY_IMG;
                    const prefixL = PREVIEW_PREFIX_LIGHT + name, prefixD = PREVIEW_PREFIX_DARK + name;
                    const storedL = localStorage.getItem(prefixL), storedD = localStorage.getItem(prefixD);
                    if (storedL?.startsWith('data:')) lightSrc = storedL;
                    else lightSrc = await getPreviewUrl(name, 'light', sharedColorValues) || (icon?.lightSrc || ICON_PATH_LIGHT + name) || EMPTY_IMG;
                    if (storedD?.startsWith('data:')) darkSrc = storedD;
                    else darkSrc = await getPreviewUrl(name, 'dark', sharedColorValues) || (icon?.darkSrc || ICON_PATH_DARK + name) || EMPTY_IMG;
                    const shortName = name.replace('.svg', '');
                    html += `<div class="shared-icon-cell">
                        <div class="preview-pair">
                            <div class="mini-preview light"><img src="${esc(lightSrc)}" alt="${esc(name)}" data-name="${esc(name)}" data-mode="light"></div>
                            <div class="mini-preview dark"><img src="${esc(darkSrc)}" alt="${esc(name)}" data-name="${esc(name)}" data-mode="dark"></div>
                        </div>
                        <div class="icon-name">${esc(shortName)}</div>
                    </div>`;
                }
                html += '</div>';
                return html;
            })();
            
            const sharedColorsHtml = SHARED_GRADIENT_COLORS.map(c => {
                const val = sharedColorValues[c.id] ?? c.default;
                const v = toColorInputValue(val, c.default);
                const vText = toHex6(val) || toHex6(c.default) || c.default;
                return `<div class="color-row shared-gradient-color" data-color-id="${esc(c.id)}">
                    <label>${esc(c.label)}</label>
                    <div class="color-swatch-wrap">
                        <span class="color-swatch-bg" style="background:${esc(v)}"></span>
                        <input type="color" value="${esc(v)}" data-default="${esc(toHex6(c.default) || c.default)}" title="${esc(c.default)}">
                    </div>
                    <input type="text" value="${esc(vText)}" maxlength="7" placeholder="#000000">
                </div>`;
            }).join('');
            
            const sharedCard = document.createElement('div');
            sharedCard.className = 'icon-card shared-gradient-card';
            sharedCard.dataset.shared = '1';
            sharedCard.innerHTML = `
                <div class="icon-info">
                    <div class="name">Shared gradient (10 icons) – one color change updates all</div>
                    ${sharedPreviewHtml}
                    <div class="icon-colors">
                        <details open>
                            <summary>7 colors – gradient + light theme / dark theme circles</summary>
                            ${sharedColorsHtml}
                        </details>
                    </div>
                    <div class="icon-actions">
                        <button class="btn btn-secondary btn-preview shared-preview-btn" title="Preview page">Preview</button>
                        <button class="btn btn-secondary btn-clear-override shared-clear-btn" title="Clear overrides for all 10">Clear All</button>
                    </div>
                </div>
            `;
            grid.appendChild(sharedCard);
            
            for (const [index, icon] of icons.entries()) {
                if (SHARED_GRADIENT_ICONS.includes(icon.name)) continue;
                const config = await getIconColorConfig(icon.name, 'light');
                const colorValues = getStoredColors(icon.name);
                const hasColors = config && config.colors && config.colors.length > 0;
                
                let lightSrc = EMPTY_IMG, darkSrc = EMPTY_IMG;
                const prefixL = PREVIEW_PREFIX_LIGHT + icon.name;
                const prefixD = PREVIEW_PREFIX_DARK + icon.name;
                const storedL = localStorage.getItem(prefixL);
                const storedD = localStorage.getItem(prefixD);
                if (storedL && storedL.startsWith('data:')) {
                    lightSrc = storedL;
                } else if (hasColors) {
                    lightSrc = await getPreviewUrl(icon.name, 'light', colorValues) || icon.lightSrc || EMPTY_IMG;
                } else {
                    lightSrc = icon.lightSrc || EMPTY_IMG;
                }
                if (storedD && storedD.startsWith('data:')) {
                    darkSrc = storedD;
                } else if (hasColors) {
                    darkSrc = await getPreviewUrl(icon.name, 'dark', colorValues) || icon.darkSrc || EMPTY_IMG;
                } else {
                    darkSrc = icon.darkSrc || EMPTY_IMG;
                }
                
                const card = document.createElement('div');
                card.className = 'icon-card';
                card.dataset.index = String(index);
                const escName = esc(icon.name);
                const escLight = esc(lightSrc);
                const escDark = esc(darkSrc);
                
                let colorsHtml = '';
                if (hasColors) {
                    const n = config.colors.length;
                    colorsHtml = `
                    <div class="icon-colors">
                        <details open>
                            <summary>${n} color${n > 1 ? 's' : ''} – modify all from this box (no repeat)</summary>
                            ${config.colors.map(c => {
                                const val = colorValues[c.id] ?? c.default;
                                const v = toColorInputValue(val, c.default);
                                const vText = toHex6(val) || toHex6(c.default) || c.default;
                                return `
                                <div class="color-row" data-color-id="${esc(c.id)}">
                                    <label>${esc(c.label)}</label>
                                    <div class="color-swatch-wrap">
                                        <span class="color-swatch-bg" style="background:${esc(v)}"></span>
                                        <input type="color" value="${esc(v)}" data-default="${esc(toHex6(c.default) || c.default)}" title="${esc(c.default)}">
                                    </div>
                                    <input type="text" value="${esc(vText)}" maxlength="7" placeholder="#000000">
                                </div>`;
                            }).join('')}
                        </details>
                    </div>`;
                } else {
                    colorsHtml = `<div class="no-colors-hint">No themeable colors in this icon.</div>`;
                }
                
                card.innerHTML = `
                    <div class="icon-preview-row">
                        <div class="icon-preview-swatch light">
                            <img src="${escLight}" alt="Light" loading="lazy" data-mode="light">
                        </div>
                        <div class="icon-preview-swatch dark">
                            <img src="${escDark}" alt="Dark" loading="lazy" data-mode="dark">
                        </div>
                    </div>
                    <div class="icon-info">
                        <div class="name">${escName}</div>
                        ${colorsHtml}
                        <div class="icon-actions">
                            <button class="btn btn-secondary btn-preview" data-index="${index}" ${ICON_TO_PAGE[icon.name] ? '' : 'disabled'} title="Preview page">Preview</button>
                            <button class="btn btn-secondary btn-clear-override" data-index="${index}" title="Clear">Clear</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            }
            
            grid.querySelectorAll('.btn-preview').forEach(btn => {
                btn.onclick = () => {
                    if (btn.classList.contains('shared-preview-btn')) {
                        const first = SHARED_GRADIENT_ICONS.find(n => ICON_TO_PAGE[n]);
                        if (first) window.open(ICON_TO_PAGE[first], '_blank', 'noopener');
                        return;
                    }
                    if (btn.disabled) return;
                    const idx = parseInt(btn.dataset.index, 10);
                    const ic = icons[idx];
                    if (ic && ICON_TO_PAGE[ic.name]) window.open(ICON_TO_PAGE[ic.name], '_blank', 'noopener');
                };
            });
            sharedCard.querySelector('.shared-clear-btn')?.addEventListener('click', () => {
                SHARED_GRADIENT_ICONS.forEach(name => {
                    localStorage.removeItem(PREVIEW_PREFIX_LIGHT + name);
                    localStorage.removeItem(PREVIEW_PREFIX_DARK + name);
                    delete colorConfigCache[name];
                });
                setStoredColors(SHARED_GRADIENT_ICONS[0], {});
                scheduleRenderGrid();
            });
            grid.querySelectorAll('.btn-clear-override').forEach(btn => {
                btn.onclick = () => {
                    const idx = parseInt(btn.dataset.index, 10);
                    const ic = icons[idx];
                    if (!ic) return;
                    if (ic.lightSrc?.startsWith('blob:')) URL.revokeObjectURL(ic.lightSrc);
                    if (ic.darkSrc?.startsWith('blob:')) URL.revokeObjectURL(ic.darkSrc);
                    localStorage.removeItem(PREVIEW_PREFIX_LIGHT + ic.name);
                    localStorage.removeItem(PREVIEW_PREFIX_DARK + ic.name);
                    delete colorConfigCache[ic.name];
                    setStoredColors(ic.name, {});
                    updateIcon(idx, { lightSrc: ICON_PATH_LIGHT + ic.name, darkSrc: ICON_PATH_DARK + ic.name });
                };
            });
            
            grid.querySelectorAll('.color-row').forEach(row => {
                const colorId = row.dataset.colorId;
                const card = row.closest('.icon-card');
                const isShared = card?.dataset?.shared === '1';
                const picker = row.querySelector('input[type="color"]');
                const text = row.querySelector('input[type="text"]');
                let applyTimer = 0;
                const apply = async () => {
                    const v = toHex6(text.value) || toHex6(picker.value) || picker.dataset.default || '#000000';
                    const vNorm = toColorInputValue(v, v);
                    picker.value = vNorm;
                    text.value = vNorm;
                    const swatch = row.querySelector('.color-swatch-bg');
                    if (swatch) swatch.style.background = vNorm;
                    if (isShared) {
                        const stored = getStoredColors(SHARED_GRADIENT_ICONS[0]);
                        stored[colorId] = vNorm;
                        setStoredColors(SHARED_GRADIENT_ICONS[0], stored);
                        for (const name of SHARED_GRADIENT_ICONS) {
                            const lightImg = card.querySelector(`.mini-preview.light img[data-name="${name}"]`);
                            const darkImg = card.querySelector(`.mini-preview.dark img[data-name="${name}"]`);
                            const lightUrl = await getPreviewUrl(name, 'light', stored);
                            const darkUrl = await getPreviewUrl(name, 'dark', stored);
                            if (lightImg && lightUrl) lightImg.src = lightUrl;
                            if (darkImg && darkUrl) darkImg.src = darkUrl;
                        }
                    } else {
                        const idx = parseInt(card?.dataset?.index ?? -1, 10);
                        const icon = icons[idx];
                        if (!icon || idx < 0) return;
                        const stored = getStoredColors(icon.name);
                        stored[colorId] = vNorm;
                        setStoredColors(icon.name, stored);
                        const lightImg = card?.querySelector('.icon-preview-swatch.light img');
                        const darkImg = card?.querySelector('.icon-preview-swatch.dark img');
                        const lightUrl = await getPreviewUrl(icon.name, 'light', stored);
                        const darkUrl = await getPreviewUrl(icon.name, 'dark', stored);
                        if (lightImg && lightUrl) lightImg.src = lightUrl;
                        if (darkImg && darkUrl) darkImg.src = darkUrl;
                    }
                };
                const scheduleApply = () => {
                    const pv = picker.value || picker.dataset.default;
                    text.value = toHex6(pv) || pv;
                    if (applyTimer) clearTimeout(applyTimer);
                    applyTimer = setTimeout(() => { applyTimer = 0; apply(); }, 100);
                };
                picker.addEventListener('input', scheduleApply);
                picker.addEventListener('change', () => {
                    if (applyTimer) clearTimeout(applyTimer);
                    applyTimer = 0;
                    const pv = picker.value || picker.dataset.default;
                    text.value = toHex6(pv) || pv;
                    const swatch = row.querySelector('.color-swatch-bg');
                    if (swatch) swatch.style.background = pv;
                    apply();
                });
                text.addEventListener('input', () => { if (/^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/.test(text.value)) picker.value = toHex6(text.value); scheduleApply(); });
                text.addEventListener('change', () => { scheduleApply(); });
            });
            
            empty.style.display = icons.length ? 'none' : 'block';
        }
        
        document.getElementById('btnResetAll').addEventListener('click', () => {
            icons.forEach(i => {
                if (i?.lightSrc?.startsWith('blob:')) URL.revokeObjectURL(i.lightSrc);
                if (i?.darkSrc?.startsWith('blob:')) URL.revokeObjectURL(i.darkSrc);
            });
            Object.keys(colorConfigCache).forEach(k => delete colorConfigCache[k]);
            ICON_FILES.forEach(f => {
                localStorage.removeItem(PREVIEW_PREFIX_LIGHT + f);
                localStorage.removeItem(PREVIEW_PREFIX_DARK + f);
                setStoredColors(f, {});
            });
            setStoredColors(SHARED_GRADIENT_ICONS[0], {});
            icons = [];
            loadBuiltInIcons();
        });
        
        function dataUrlToBinary(dataUrl) {
            if (!dataUrl || !dataUrl.startsWith('data:')) return null;
            const comma = dataUrl.indexOf(',');
            if (comma < 0) return null;
            const header = dataUrl.slice(0, comma);
            const payload = dataUrl.slice(comma + 1);
            if (header.includes('base64')) {
                try {
                    const binary = atob(payload);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    return bytes;
                } catch (e) { return null; }
            }
            try { return new TextEncoder().encode(decodeURIComponent(payload)); } catch (e) { return null; }
        }
        
        function dataUrlToSvgText(dataUrl) {
            if (!dataUrl || !dataUrl.startsWith('data:')) return '';
            const comma = dataUrl.indexOf(',');
            if (comma < 0) return '';
            const payload = dataUrl.slice(comma + 1);
            const header = dataUrl.slice(0, comma);
            if (header.includes('base64')) {
                try {
                    const bin = atob(payload);
                    const bytes = new Uint8Array(bin.length);
                    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    return new TextDecoder().decode(bytes);
                } catch (e) { return ''; }
            }
            try { return decodeURIComponent(payload); } catch (e) { return ''; }
        }
        
        async function getSvgWithColors(filename, mode) {
            const prefix = mode === 'light' ? PREVIEW_PREFIX_LIGHT : PREVIEW_PREFIX_DARK;
            const stored = localStorage.getItem(prefix + filename);
            if (stored && stored.startsWith('data:')) {
                const txt = dataUrlToSvgText(stored);
                if (txt) return txt;
            }
            const path = mode === 'light' ? ICON_PATH_LIGHT : ICON_PATH_DARK;
            const r = await fetch(path + filename);
            if (r.ok) return await r.text();
            return '';
        }
        
        async function downloadIconZip() {
            if (typeof JSZip === 'undefined') { alert('JSZip not loaded'); return; }
            const zip = new JSZip();
            const lightFolder = zip.folder('public/app-icon/icon/light');
            const darkFolder = zip.folder('public/app-icon/icon/dark');
            for (const filename of ICON_FILES) {
                const prefixL = PREVIEW_PREFIX_LIGHT + filename;
                const prefixD = PREVIEW_PREFIX_DARK + filename;
                const storedL = localStorage.getItem(prefixL);
                const storedD = localStorage.getItem(prefixD);
                let lightSvg = '', darkSvg = '';
                if (storedL && storedL.startsWith('data:')) lightSvg = dataUrlToSvgText(storedL);
                if (storedD && storedD.startsWith('data:')) darkSvg = dataUrlToSvgText(storedD);
                if (!lightSvg) lightSvg = await getSvgWithColors(filename, 'light');
                if (!darkSvg) darkSvg = await getSvgWithColors(filename, 'dark');
                const colorValues = getStoredColors(filename);
                if (SHARED_GRADIENT_ICONS.includes(filename) && Object.keys(colorValues).length) {
                    const lightConfig = await getIconColorConfig(filename, 'light');
                    const darkConfig = await getIconColorConfig(filename, 'dark');
                    const lightVals = { ...getDefaults(lightConfig), ...colorValues };
                    const darkVals = { ...getDefaults(darkConfig), ...colorValues };
                    if (lightConfig) lightSvg = applySvgColors(lightSvg, lightConfig, lightVals);
                    if (darkConfig) darkSvg = applySvgColors(darkSvg, darkConfig, darkVals);
                } else {
                    const config = lightSvg ? parseSvgColors(lightSvg) : null;
                    if (config && Object.keys(colorValues).length) {
                        const vals = { ...getDefaults(config), ...colorValues };
                        lightSvg = applySvgColors(lightSvg, config, vals);
                        darkSvg = applySvgColors(darkSvg, config, vals);
                    }
                }
                if (lightSvg) lightFolder.file(filename, lightSvg);
                if (darkSvg) darkFolder.file(filename, darkSvg);
            }
            const blob = await zip.generateAsync({ type: 'blob' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'icon.zip';
            a.click();
            URL.revokeObjectURL(a.href);
        }
        
        document.getElementById('btnDownloadIcons').addEventListener('click', downloadIconZip);
        
        loadBuiltInIcons();
    </script>
</body>
