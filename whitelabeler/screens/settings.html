<!-- Settings -->
<section
  class="screen-panel settings"
  data-screen="settings"
  aria-label="Settings screen"
  hidden
>
  <main class="app-screen app-screen--home app-screen--settings" role="main" aria-labelledby="settings-title">
    <h1 id="settings-title" class="visually-hidden">Settings</h1>

    <button type="button" class="settings__back" aria-label="Go back">
      <img class="settings__back-icon" src="assets/icons/settings/back.png" alt="" width="26" height="24" />
    </button>

    <p class="settings__heading" aria-hidden="true">Settings</p>

    <div class="settings-panel-shell">
      <section class="settings-panel" aria-label="Settings options">
        <div class="settings-group settings-group--information">
          <h2 class="settings-section">INFORMATION</h2>

          <ul class="settings-list settings-list--information" role="list">
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/account-settings.png" alt="" width="23" height="23" />
              <span class="settings-item__label">Account Settings</span>
            </button>
          </li>
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/update-config.png" alt="" width="23" height="23" />
              <span class="settings-item__label">Update Configuration</span>
            </button>
          </li>
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/app-language.png" alt="" width="23" height="23" />
              <span class="settings-item__label">App Languagge</span>
            </button>
          </li>
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/dark-theme.png" alt="" width="23" height="23" />
              <span class="settings-item__label">Dark Theme</span>
            </button>
          </li>
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/about.png" alt="" width="23" height="23" />
              <span class="settings-item__label">About</span>
            </button>
          </li>
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/privacy-policy.png" alt="" width="23" height="23" />
              <span class="settings-item__label">Privacy Policy</span>
            </button>
          </li>
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/help.png" alt="" width="23" height="23" />
              <span class="settings-item__label">Help</span>
            </button>
          </li>
          </ul>
        </div>

        <div class="settings-group settings-group--debugging">
          <h2 class="settings-section">DEBUGGING</h2>

          <ul class="settings-list settings-list--debugging" role="list">
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/debugging-logs.png" alt="" width="22" height="22" />
              <span class="settings-item__label">Debugging Logs</span>
            </button>
          </li>
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/clear-logs.png" alt="" width="23" height="23" />
              <span class="settings-item__label">Clear Logs</span>
            </button>
          </li>
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/disable-logs.png" alt="" width="23" height="17" />
              <span class="settings-item__label">Disable Logs</span>
            </button>
          </li>
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/enable-logs.png" alt="" width="23" height="23" />
              <span class="settings-item__label">Enable Logs</span>
            </button>
          </li>
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/email-logs.png" alt="" width="25" height="18" />
              <span class="settings-item__label">Email Logs</span>
            </button>
          </li>
          <li class="settings-item">
            <button type="button" class="settings-item__button">
              <img class="settings-item__icon" src="assets/icons/settings/websocket-test.png" alt="" width="23" height="20" />
              <span class="settings-item__label">WebSocket Test</span>
            </button>
          </li>
          </ul>
        </div>
      </section>
    </div>
  </main>
</section>
