<!-- Get Started -->
<section
  class="screen-panel get-started"
  data-screen="get-started"
  aria-label="Get Started screen"
  hidden
>
  <main
    class="app-screen app-screen--onboarding"
    role="main"
    aria-labelledby="get-started-title"
  >
    <h1 id="get-started-title" class="visually-hidden">Get Started</h1>

    <div class="app-screen__body">
      <div class="onboarding__hero">
        <img
          class="app-icon"
          data-asset-key="APP_ICON"
          src="assets/images/app-icon-squircle.png"
          alt="Tragofone app icon"
          width="168"
          height="168"
          decoding="async"
        />
      </div>

      <div class="onboarding__actions">
        <p class="legal-text">
          By Joining I accept Tragofone Terms of service to learn more about
          how to handle and protect personal data, read our
          <a class="link link--accent" href="#">Privacy Policy</a>
        </p>

        <button type="button" class="btn btn--primary">Get Started</button>

        <div class="pagination-dots" role="tablist" aria-label="Onboarding steps">
          <span
            class="pagination-dots__item pagination-dots__item--active"
            role="tab"
            aria-selected="true"
            aria-label="Step 1 of 2"
          ></span>
          <span
            class="pagination-dots__item"
            role="tab"
            aria-selected="false"
            aria-label="Step 2 of 2"
          ></span>
        </div>
      </div>
    </div>
  </main>
</section>
