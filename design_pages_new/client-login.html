<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef1f7;
            display: grid;
            place-items: center;
            color: #1f2937;
        }

        .login-box {
            width: min(420px, calc(100% - 32px));
            background: #ffffff;
            border: 1px solid #dde3ef;
            border-radius: 14px;
            padding: 28px 24px;
            box-shadow: 0 14px 32px rgba(30, 41, 59, 0.12);
        }

        .title {
            margin: 0 0 6px;
            font-size: 24px;
            font-weight: 700;
        }

        .subtitle {
            margin: 0 0 22px;
            font-size: 13px;
            color: #6b7280;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            height: 44px;
            border: 1px solid #cfd6e4;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        .field input:focus {
            border-color: #3653d6;
            box-shadow: 0 0 0 3px rgba(54, 83, 214, 0.14);
        }

        .error {
            min-height: 18px;
            margin: 0 0 12px;
            font-size: 12px;
            color: #b91c1c;
        }

        .login-btn {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            background: #3653d6;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }

        .login-btn:hover {
            background: #2d47bb;
        }
    </style>
</head>
<body>
    <form id="clientLoginForm" class="login-box">
        <h1 class="title">Login</h1>
        <p class="subtitle">Common sign in for all clients</p>

        <div class="field">
            <label for="usernameInput">Username</label>
            <input id="usernameInput" type="text" autocomplete="username" placeholder="Enter username" required>
        </div>

        <div class="field">
            <label for="passwordInput">Password</label>
            <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Enter password" required>
        </div>

        <p class="error" id="errorText"></p>
        <button type="submit" class="login-btn">Login</button>
    </form>

    <script>
        (function() {
            var AUTH_STORAGE_KEY = 'wl-active-client';
            var LOGIN_TIME_KEY = 'wl-last-login-time';
            var form = document.getElementById('clientLoginForm');
            var usernameInput = document.getElementById('usernameInput');
            var passwordInput = document.getElementById('passwordInput');
            var errorText = document.getElementById('errorText');

            function normalizeUsername(value) {
                return String(value || '').trim().replace(/\s+/g, ' ');
            }

            form.addEventListener('submit', function(event) {
                event.preventDefault();
                errorText.textContent = '';

                var username = normalizeUsername(usernameInput.value);
                var password = String(passwordInput.value || '').trim();

                if (!username || !password) {
                    errorText.textContent = 'Please enter username and password.';
                    return;
                }

                localStorage.setItem(AUTH_STORAGE_KEY, username);
                localStorage.setItem(LOGIN_TIME_KEY, String(Date.now()));
                window.location.href = 'whitelabel-preview.html';
            });
        })();
    </script>
</body>
</html>
