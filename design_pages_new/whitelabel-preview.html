<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/wl-client-localstorage-ns.js"></script>
    <title>White-Label Theme Preview</title>
    <link rel="stylesheet" href="../assets/wl-studio.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--wl-bg, #0f1020);
            background-image: var(--wl-backdrop);
            background-attachment: fixed;
            color: var(--wl-text, #eee);
            min-height: 100vh;
        }
        
        .preview-layout { display: flex; height: 100vh; }
        
        /* Theme Panel */
        .theme-panel {
            width: 360px; min-width: 360px;
            background: var(--wl-panel, rgba(255,255,255,0.05));
            border-right: 1px solid var(--wl-border, #0f3460);
            backdrop-filter: blur(10px);
            overflow-y: auto; padding: 16px; flex-shrink: 0;
        }
        .theme-panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--wl-accent, #8ecae6); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--wl-border, #0f3460); }
        .theme-panel h3 { font-size: 12px; color: var(--wl-muted, #aaa); margin: 12px 0 8px; }
        
        .control-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; min-height: 44px; }
        .control-row label { flex: 0 0 120px; font-size: 12px; color: #e0e0e0; line-height: 1.2; }
        .control-row .color-inputs { display: flex; align-items: center; gap: 8px; flex: 1; }
        .control-row input[type="color"] { width: 56px; height: 48px; min-width: 56px; border: 2px solid var(--wl-border, #0f3460); cursor: pointer; border-radius: 8px; padding: 3px; background: var(--wl-elevated, rgba(255,255,255,0.06)); box-shadow: 0 0 0 1px rgba(255,255,255,0.1); }
        .control-row input[type="color"]:hover { border-color: var(--wl-accent, #8ecae6); }
        .control-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
        .control-row input[type="color"]::-webkit-color-swatch { border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); }
        .control-row input[type="text"] { flex: 1; min-width: 80px; max-width: 120px; padding: 10px 12px; font-size: 13px; background: var(--wl-elevated, rgba(255,255,255,0.06)); border: 2px solid var(--wl-border, #0f3460); color: #fff; border-radius: 6px; }
        .control-row input[type="text"]:focus { outline: none; border-color: var(--wl-accent, #8ecae6); }
        .control-row.gradient-row { flex-direction: column; align-items: stretch; margin-bottom: 14px; }
        .control-row.gradient-row label { flex: none; margin-bottom: 6px; }
        /* Stacked rows + swatches (.color-swatch-wrap) */
        .gradient-colors { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
        .gradient-color-item { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .gradient-color-item .gradient-swatch-label { flex: 0 0 52px; font-size: 11px; color: #aaa; line-height: 1.2; }
        .gradient-color-item .color-swatch-wrap {
            position: relative; flex-shrink: 0; width: 44px; height: 36px; cursor: pointer;
            border-radius: 6px; overflow: hidden; border: 2px solid var(--wl-border, #0f3460);
        }
        .gradient-color-item .color-swatch-wrap:hover { border-color: var(--wl-accent, #8ecae6); }
        .gradient-color-item .color-swatch-wrap .color-swatch-bg { position: absolute; inset: 0; border-radius: 4px; pointer-events: none; }
        .gradient-color-item .color-swatch-wrap input[type="color"] {
            position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
            padding: 0; border: none; background: transparent;
        }
        .gradient-color-item input[type="text"] {
            flex: 1; min-width: 0; padding: 8px 10px; font-size: 12px; background: var(--wl-elevated, rgba(255,255,255,0.06));
            border: 2px solid var(--wl-border, #0f3460); color: #fff; border-radius: 6px;
        }
        .gradient-color-item input[type="text"]:focus { outline: none; border-color: var(--wl-accent, #8ecae6); }
        
        .btn { padding: 9px 16px; font-size: 12px; border: 1px solid transparent; border-radius: var(--wl-radius-sm, 8px); cursor: pointer; font-weight: 600; transition: filter .15s ease, background .15s ease, border-color .15s ease; }
        .btn-primary { background: var(--wl-gradient, linear-gradient(135deg, #8ecae6, #b794f6)); color: var(--wl-on-accent, #14152b); }
        .btn-primary:hover { filter: brightness(1.07); }
        .btn-secondary { background: transparent; color: var(--wl-text, #eee); border-color: var(--wl-border, #0f3460); }
        .btn-secondary:hover { background: var(--wl-elevated, rgba(255,255,255,0.06)); border-color: var(--wl-border-strong, rgba(255,255,255,0.24)); }
        
        .btn-group { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        
        .page-select { width: 100%; padding: 10px 12px; font-size: 13px; background: var(--wl-elevated, rgba(255,255,255,0.06)); border: 1px solid var(--wl-border, #0f3460); color: #fff; border-radius: var(--wl-radius-sm, 8px); margin-bottom: 16px; cursor: pointer; }
        .page-select:focus { outline: none; border-color: var(--wl-accent, #8ecae6); }
        .page-select option { background: var(--wl-panel-solid, #16182e); color: #fff; }
        
        .theme-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
        .theme-toggle button { flex: 1; padding: 10px; font-size: 12px; border: 1px solid var(--wl-border, #0f3460); background: transparent; color: var(--wl-text, #8ecae6); border-radius: var(--wl-radius-sm, 8px); cursor: pointer; font-weight: 600; }
        .theme-toggle button.active { background: var(--wl-gradient, linear-gradient(135deg, #8ecae6, #b794f6)); color: var(--wl-on-accent, #14152b); border-color: transparent; }
        
        .preview-frame-wrap {
            flex: 1; display: flex; overflow: hidden; background: #080812;
        }

        /* ── Preview canvas (stage) ── */
        .preview-canvas {
            flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 50% 50%, #0e0e24 0%, #080812 70%);
        }
       

        /* ── Fixed-size window box ── */
        .preview-window-outer {
            transform-origin: center center;
            flex-shrink: 0;
            filter: drop-shadow(0 24px 64px rgba(0,0,0,0.8));
        }
        .preview-window-chrome {
            background: #1c1c2e; border-radius: 10px 10px 0 0;
            padding: 9px 14px; display: flex; align-items: center; gap: 10px;
            border: 1px solid #2a2a42; border-bottom: 1px solid #111;
            user-select: none;
        }
        .traffic-lights { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        .traffic-lights span { width: 12px; height: 12px; border-radius: 50%; display: block; }
        .traffic-lights span.tl-red { cursor: pointer; }
        .traffic-lights span.tl-red:hover { filter: brightness(1.12); box-shadow: 0 0 0 1px rgba(255,255,255,0.25); }
        .traffic-lights .preview-close-hint { font-size: 10px; color: #666; margin-left: 6px; user-select: none; }
        .tl-red    { background: #ff5f57; }
        .tl-yellow { background: #febc2e; }
        .tl-green  { background: #28c840; }
        .chrome-title {
            flex: 1; text-align: center; font-size: 11px; color: #666;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .preview-window-body {
            border: 1px solid #2a2a42; border-top: none;
            border-radius: 0 0 8px 8px; overflow: hidden;
        }
        .preview-frame { display: block; border: none; background: #fff; width: 1280px; height: 780px; }
        
        .gradient-note { font-size: 10px; color: #666; margin-top: 4px; }
        .section { margin-bottom: 16px; }
        .asset-details { margin-top: 12px; font-size: 11px; }
        .asset-details summary { cursor: pointer; color: #8ecae6; padding: 4px 0; }
        .asset-details summary:hover { text-decoration: underline; }
        .asset-slots-list { margin-top: 8px; padding: 8px; background: var(--wl-elevated, rgba(255,255,255,0.06)); border: 1px solid var(--wl-border, #0f3460); border-radius: 6px; color: var(--wl-muted, #ccc); }
        .asset-table { width: 100%; font-size: 10px; border-collapse: collapse; margin: 8px 0; }
        .asset-table th, .asset-table td { padding: 4px 6px; text-align: left; border-bottom: 1px solid #1a4a6e; }
        .asset-table th { color: #8ecae6; }
        .asset-table code { font-size: 9px; background: #16213e; padding: 1px 4px; border-radius: 3px; }
    </style>
</head>
<body>

    <script>
        const CONFIG_URL = 'whitelabel-config.json';
        const AUTH_STORAGE_KEY = 'wl-active-client';
        const CLIENT_STATE_KEY_PREFIX = 'wl-client-preview-state:';
        let config = { light: {}, dark: {} };
        let currentTheme = 'light';
        const ASSET_PATH_MAP = {
            'logo-color.svg': 'assets/img-new/logo-color.svg',
            'logo.svg': 'assets/img-new/logo.svg',
            'logo-header.svg': 'public/app-icon/logo/logo-header.svg',
            'logo-white.svg': 'public/app-icon/logo/logo-white.svg',
            'curves.svg': 'assets/img-new/curves.svg',
            'curves-2.svg': 'assets/img-new/curves-2.svg',
            'arrow-down.svg': 'assets/img-new/arrow-down.svg',
            'online.svg': 'assets/img-new/online.svg',
            'away.svg': 'assets/img-new/away.svg',
            'busy.svg': 'assets/img-new/busy.svg',
            'dnd.svg': 'assets/img-new/dnd.svg',
         
        };
        function getAssetPaths(filename) {
            if (filename === 'logo-white.svg') {
                return ['public/app-icon/logo/logo-white.svg', 'assets/img-new/logo-white.svg', 'assets/img-new/trago-white.svg'];
            }
            if (filename === 'check-mail.svg') {
                return [
                    'public/app-icon/icon/light/check-mail.svg',
                    'public/app-icon/icon/dark/check-mail.svg',
                    'assets/img-new/check-mail.svg'
                ];
            }
            const mapped = ASSET_PATH_MAP[filename];
            if (Array.isArray(mapped)) return mapped;
            if (mapped) return [mapped];
            return ['assets/img-new/' + filename];
        }

        function getActiveClient() {
            return (localStorage.getItem(AUTH_STORAGE_KEY) || '').trim();
        }

        function getClientStateKey(client) {
            return CLIENT_STATE_KEY_PREFIX + String(client || '').toLowerCase();
        }

        function requireClientSession() {
            const client = getActiveClient();
            if (!client) {
                window.location.href = '../index.html';
                return null;
            }
            return client;
        }

        function updateClientSessionUi(client) {
            const label = document.getElementById('clientSessionLabel');
            if (label) label.textContent = 'Client: ' + client;
        }
        
        async function loadConfig() {
            const res = await fetch(CONFIG_URL);
            config = await res.json();
            return config;
        }
        
        function parseGradientColors(str) {
            const matches = (str || '').match(/#[0-9A-Fa-f]{6}|#[0-9A-Fa-f]{3}(?![0-9A-Fa-f])/g);
            return matches ? [...matches.slice(0, 4)].map(c => toHex6(c) || c) : ['#6533e2', '#7349de', '#1f97ef'];
        }

        function setControlValue(mode, item, value) {
            if (!item || value === undefined || value === null) return;
            const wrapper = document.querySelector(`[data-var="${item.var}"][data-mode="${mode}"]`);
            if (!wrapper) return;
            if (item.type === 'gradient') {
                const colors = parseGradientColors(String(value));
                const colorInputs = wrapper.querySelectorAll('input[type="color"]');
                const textInputs = wrapper.querySelectorAll('.gradient-color-item input[type="text"]');
                const swatchBgs = wrapper.querySelectorAll('.gradient-color-item .color-swatch-bg');
                colors.forEach((col, index) => {
                    const hex = toHex6(col) || col;
                    if (colorInputs[index]) colorInputs[index].value = hex;
                    if (textInputs[index]) textInputs[index].value = hex;
                    if (swatchBgs[index] && isHexColor(hex)) swatchBgs[index].style.background = hex;
                });
                const angleMatch = String(value).match(/(\d+(?:\.\d+)?deg)/);
                if (angleMatch) wrapper.dataset.angle = angleMatch[1];
                return;
            }
            const textInput = wrapper.querySelector('input[type="text"]');
            const colorInput = wrapper.querySelector('input[type="color"]');
            if (textInput) textInput.value = String(value);
            if (colorInput && isHexColor(String(value))) colorInput.value = toHex6(String(value));
        }
        function toHex6(hex) {
            if (!hex || !/^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/.test(String(hex).trim())) return hex;
            const h = String(hex).trim().slice(1);
            if (h.length === 3) return '#' + h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
            return hex;
        }
        function isHexColor(val) {
            return val && /^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/.test(String(val).trim());
        }
        function buildGradient(colors, angle) {
            const c = colors.filter(x => x && isHexColor(x)).map(x => toHex6(x));
            if (!c.length) return 'linear-gradient(270deg, #6533e2 0%, #1f97ef 100%)';
            const pcts = c.length === 2 ? [0, 100] : c.length === 3 ? [0, 50, 100] : [0, 33, 66, 100];
            const stops = c.map((col, i) => `${col} ${pcts[i] || 0}%`).join(', ');
            return `linear-gradient(${angle || '270deg'}, ${stops})`;
        }
        
        function createColorInput(key, item, mode) {
            const isGradient = item.type === 'gradient';
            const isImage = item.type === 'image';
            const wrapper = document.createElement('div');
            wrapper.className = isGradient ? 'control-row gradient-row' : 'control-row';
            wrapper.dataset.var = item.var;
            wrapper.dataset.mode = mode;
            
            const label = document.createElement('label');
            label.textContent = item.label;
            wrapper.appendChild(label);
            
            if (isGradient) {
                const colors = parseGradientColors(item.value);
                const angle = (item.value || '').match(/(\d+(?:\.\d+)?deg)/)?.[1] || '270deg';
                wrapper.dataset.angle = angle;
                const gradientEl = document.createElement('div');
                gradientEl.className = 'gradient-colors';
                
                const labels = colors.length === 4 ? ['Start', 'Mid1', 'Mid2', 'End'] : ['Start', 'Mid', 'End'];
                colors.forEach((col, i) => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'gradient-color-item';
                    const labelEl = document.createElement('span');
                    labelEl.className = 'gradient-swatch-label';
                    labelEl.textContent = labels[i];
                    const swatchWrap = document.createElement('div');
                    swatchWrap.className = 'color-swatch-wrap';
                    const swatchBg = document.createElement('span');
                    swatchBg.className = 'color-swatch-bg';
                    const hex0 = toHex6(col) || col;
                    swatchBg.style.background = isHexColor(hex0) ? hex0 : '#6533e2';
                    const colorInput = document.createElement('input');
                    colorInput.type = 'color';
                    colorInput.value = isHexColor(hex0) ? hex0 : '#6533e2';
                    colorInput.title = 'Click to pick color';
                    const textInput = document.createElement('input');
                    textInput.type = 'text';
                    textInput.value = hex0;
                    textInput.placeholder = '#000000';
                    textInput.title = 'Enter hex (e.g. #ff0000)';
                    const updateGradient = () => {
                        let hex = colorInput.value;
                        if (!hex || !isHexColor(hex)) hex = isHexColor(textInput.value) ? toHex6(textInput.value) : toHex6(col) || col;
                        hex = toHex6(hex) || hex;
                        colorInput.value = hex;
                        textInput.value = hex;
                        swatchBg.style.background = hex;
                        const allColorInputs = gradientEl.querySelectorAll('input[type="color"]');
                        const collected = Array.from(allColorInputs).map(inp => (inp.value || '').trim()).filter(Boolean);
                        buildGradient(collected.length ? collected : [hex], angle);
                        injectOverrideStyle();
                    };
                    swatchWrap.appendChild(swatchBg);
                    swatchWrap.appendChild(colorInput);
                    colorInput.addEventListener('input', updateGradient);
                    colorInput.addEventListener('change', updateGradient);
                    textInput.addEventListener('input', () => {
                        if (isHexColor(textInput.value)) colorInput.value = toHex6(textInput.value);
                        updateGradient();
                    });
                    itemEl.appendChild(labelEl);
                    itemEl.appendChild(swatchWrap);
                    itemEl.appendChild(textInput);
                    gradientEl.appendChild(itemEl);
                });
                wrapper.appendChild(gradientEl);
            } else if (isImage) {
                const inputsWrap = document.createElement('div');
                inputsWrap.className = 'color-inputs';
                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.value = item.value || '';
                textInput.placeholder = 'url(...) or upload';
                textInput.title = 'CSS url() or upload file';
                textInput.style.flex = '1';
                textInput.style.minWidth = '100px';
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = '.svg,.png,.jpg,.jpeg,.gif,.webp';
                fileInput.style.display = 'none';
                const uploadBtn = document.createElement('button');
                uploadBtn.type = 'button';
                uploadBtn.className = 'btn btn-secondary';
                uploadBtn.textContent = 'Upload';
                uploadBtn.style.padding = '6px 12px';
                uploadBtn.style.fontSize = '11px';
                uploadBtn.onclick = () => fileInput.click();
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files?.[0];
                    if (!file) return;
                    const blobUrl = URL.createObjectURL(file);
                    const urlVal = `url("${blobUrl}")`;
                    textInput.value = urlVal;
                    const assetPath = item.assetPath || 'assets/img-new/' + file.name;
                    addUploadedAsset(assetPath, file);
                    updateAssetsInfo();
                    applyVar(item.var, urlVal);
                    injectOverrideStyle();
                    applyAllStored();
                    e.target.value = '';
                });
                textInput.addEventListener('input', () => {
                    applyVar(item.var, textInput.value);
                    injectOverrideStyle();
                });
                inputsWrap.appendChild(textInput);
                inputsWrap.appendChild(uploadBtn);
                wrapper.appendChild(inputsWrap);
            } else {
                const isHex = isHexColor(item.value);
                const inputsWrap = document.createElement('div');
                inputsWrap.className = 'color-inputs';
                const textInput = document.createElement('input');

                    const colorInput = document.createElement('input');
                    colorInput.type = 'color';

        function getFrameDoc() {

        /** Dark-mode vars that elements use directly (e.g. SVGs use --primary-color, not --primary-color-dark) */

            if (h.length === 4) {

            return h.toLowerCase();

        function injectOverrideStyle() {
            const doc = getFrameDoc();
            if (!doc || !doc.documentElement) return;
            let style = doc.getElementById(OVERRIDE_STYLE_ID);
            if (!style) {
                style = doc.createElement('style');
                style.id = OVERRIDE_STYLE_ID;
                (doc.head || doc.documentElement).appendChild(style);
            }
            const colors = currentTheme === 'light' ? (config.light || {}) : (config.dark || {});
            const lines = [];
            const valueByVar = {};
            for (const [key, item] of Object.entries(colors)) {
                const wrapper = document.querySelector(`[data-var="${item.var}"][data-mode="${currentTheme}"]`);
                if (!wrapper) continue;
                if (item.type === 'gradient') {
                    const val = getGradientValueFromWrapper(wrapper);
                    if (val) {
                        const vars = new Set(item.gradientVars || [item.var]);
                        vars.forEach(v => { lines.push(`${v}: ${val};`); valueByVar[v] = val; });

                        // Sync individual stop vars so icon SVGs that chain via
                        // --icon-gradient-X-light → var(--gradient-X-color) also update.
                        const stopColors = getGradientColorsFromWrapper(wrapper);
                        const isLight = currentTheme === 'light';
                        const stopVarNames = isLight
                            ? ['--gradient-1-color', '--gradient-2-color', '--gradient-3-color', '--gradient-4-color']
                            : ['--gradient-1-color-dark', '--gradient-2-color-dark', '--gradient-3-color-dark', '--gradient-4-color-dark'];
                        const iconVarNames = isLight
                            ? ['--icon-gradient-1-light', '--icon-gradient-2-light', '--icon-gradient-3-light', '--icon-gradient-4-light']
                            : ['--icon-gradient-1-dark', '--icon-gradient-2-dark', '--icon-gradient-3-dark', '--icon-gradient-4-dark'];
                        stopColors.forEach((col, i) => {
                            if (!col) return;
                            if (stopVarNames[i]) { lines.push(`${stopVarNames[i]}: ${col};`); valueByVar[stopVarNames[i]] = col; }
                            if (iconVarNames[i]) { lines.push(`${iconVarNames[i]}: ${col};`); valueByVar[iconVarNames[i]] = col; }
                        });
                    }
                } else {
                    const input = wrapper.querySelector('input[type="text"]') || wrapper.querySelector('input[type="color"]');
                    const val = input ? input.value : item.value;
                    if (val) {
                        valueByVar[item.var] = val;
                        /* Light: defer --input-icon so it can stay var(--primary-color) when colors match. */
                        if (currentTheme === 'light' && item.var === '--input-icon') continue;
                        lines.push(`${item.var}: ${val};`);
                    }
                }
            }
            if (currentTheme === 'light') {
                const p = valueByVar['--primary-color'];
                const i = valueByVar['--input-icon'];
                if (i !== undefined && i !== '') {
                    if (p && normalizeHex(p) === normalizeHex(i)) {
                        lines.push('--input-icon: var(--primary-color);');
                    } else {
                        lines.push(`--input-icon: ${i};`);
                    }
                }
            }
            if (currentTheme === 'dark') {
                for (const [darkVar, aliasVar] of Object.entries(DARK_ALIAS_MAP)) {
                    if (valueByVar[darkVar] && !valueByVar[aliasVar]) lines.push(`${aliasVar}: ${valueByVar[darkVar]} !important;`);
                }
            }
            /* Auto-sync: --icon-primary / --icon-primary-light always follow primary color */
            const _iconPrimaryVal = valueByVar['--primary-color'] || valueByVar['--primary-color-dark'];
            if (_iconPrimaryVal) {
                lines.push(`--icon-primary-light: ${_iconPrimaryVal};`);
                lines.push(`--icon-primary: ${_iconPrimaryVal};`);
            }
            const iconColorFromStorage = localStorage.getItem('whitelabel-icon-color');
            if (iconColorFromStorage && /^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/.test(iconColorFromStorage.trim())) {
                const hex = iconColorFromStorage.trim();
                const expanded = hex.length === 4 ? '#' + hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3] : hex;
                lines.push('--icon-color: ' + expanded + ';');
            }
            const selector = `html[data-theme="${currentTheme}"]`;
            style.textContent = lines.length ? `${selector} { ${lines.join(' ')} }` : '';
        }

        /** Dual-mode icons (img[data-mode] / .icon-svg-inline[data-mode]) rely on html[data-theme].
         * In flex modal bodies, visibility can fail to update when theme toggles from the parent frame;
         * bump specificity so light/dark asset swaps match the preview theme (e.g. autoStartup modal). */
        function injectDualModeIconThemeFix(doc) {
            if (!doc || !doc.head) return;
            let fix = doc.getElementById(DUAL_MODE_ICON_FIX_ID);
            if (!fix) {
                fix = doc.createElement('style');
                fix.id = DUAL_MODE_ICON_FIX_ID;
                doc.head.appendChild(fix);
            }
            fix.textContent = [
                'html[data-theme="light"] .logout-modal-popup .modal-body img[data-mode="light"],',
                'html[data-theme="light"] .logout-modal-popup .modal-body .icon-svg-inline[data-mode="light"] { display: inline-block !important; }',
                'html[data-theme="light"] .logout-modal-popup .modal-body img[data-mode="dark"],',
                'html[data-theme="light"] .logout-modal-popup .modal-body .icon-svg-inline[data-mode="dark"] { display: none !important; }',
                'html[data-theme="dark"] .logout-modal-popup .modal-body img[data-mode="dark"],',
                'html[data-theme="dark"] .logout-modal-popup .modal-body .icon-svg-inline[data-mode="dark"] { display: inline-block !important; }',
                'html[data-theme="dark"] .logout-modal-popup .modal-body img[data-mode="light"],',
                'html[data-theme="dark"] .logout-modal-popup .modal-body .icon-svg-inline[data-mode="light"] { display: none !important; }'
            ].join(' ');
        }

        /** Red “close” dot: snap panel to Light and force a fresh iframe load (cache-bust) so preview matches theme controls; avoids reload() quirks on file://. */
        function closePreviewClearTheme() {
            var btnL = document.getElementById('btnLight');
            var btnD = document.getElementById('btnDark');
            if (btnL) btnL.classList.add('active');
            if (btnD) btnD.classList.remove('active');
            applyTheme('light');
            var frame = document.getElementById('previewFrame');
            var sel = document.getElementById('pageSelect');
            if (!frame) return;
            var page = (sel && sel.value) ? sel.value : 'login.html';
            var base = page.replace(/^([^?#]+).*$/, '$1');
            frame.src = base + '?_wl_prev_reset=' + Date.now();
        }
        
        function applyTheme(theme) {
            currentTheme = theme;
            const lightSection = document.getElementById('lightColorsSection');
            const darkSection = document.getElementById('darkColorsSection');
            if (lightSection) lightSection.style.display = theme === 'light' ? 'block' : 'none';
            if (darkSection) darkSection.style.display = theme === 'dark' ? 'block' : 'none';
            /* Re-apply immediately and on short delays: iframe contentDocument can be null briefly
               after navigation or style injection; if applyAllStored fails, data-theme stays on the old
               value (e.g. dark) while the panel shows Light — looks “stuck” on dark. */
            applyAllStored(0);
            requestAnimationFrame(() => applyAllStored(0));
            [30, 90, 200, 450].forEach((ms) => setTimeout(() => applyAllStored(0), ms));
        }
        
        function getGradientValueFromWrapper(wrapper) {
            const items = wrapper?.querySelectorAll('.gradient-color-item');
            if (!items?.length) return null;
            const colors = [];
            items.forEach(it => {
                const inp = it.querySelector('input[type="color"]') || it.querySelector('input[type="text"]');
                if (inp?.value) colors.push(toHex6(inp.value) || inp.value);
            });
            const angle = wrapper?.dataset?.angle || '270deg';
            return colors.length ? buildGradient(colors, angle) : null;
        }

        /** Returns individual stop hex colors from a gradient wrapper (same order as the swatches). */
        function getGradientColorsFromWrapper(wrapper) {
            const items = wrapper?.querySelectorAll('.gradient-color-item');
            if (!items?.length) return [];
            const colors = [];
            items.forEach(it => {
                const inp = it.querySelector('input[type="color"]') || it.querySelector('input[type="text"]');
                if (inp?.value) colors.push(toHex6(inp.value) || inp.value);

        function injectUploadedStyle() {
            const doc = getFrameDoc();
            if (!doc || !doc.documentElement || !uploadedCssContent) return;
            let style = doc.getElementById(UPLOADED_STYLE_ID);

                style = doc.createElement('style');
                style.id = UPLOADED_STYLE_ID;
                (doc.head || doc.documentElement).appendChild(style);
            }

        function removeUploadedStyle() {

        const ASSET_OVERRIDE_STYLE_ID = 'whitelabel-asset-overrides';
        function applyUploadedAssets() {
            const doc = getFrameDoc();
            if (!doc || !doc.documentElement) return;
            const imgs = doc.querySelectorAll('img[src]');
            imgs.forEach(img => {
                const src = img.getAttribute('src') || '';
                for (const [assetPath, data] of Object.entries(uploadedAssets)) {
                    const assetFilename = assetPath.split('/').pop();
                    if (src.includes(assetFilename) || src.includes(assetPath)) {
                        img.src = data.blobUrl;
                        break;
                    }
                }
            });
            doc.querySelectorAll('[style*="background-image"]').forEach(el => {
                const bg = el.style.backgroundImage || '';
                const urlMatch = bg.match(/url\(['"]?([^'")]+)['"]?\)/);
                if (urlMatch) {
                    const urlPath = urlMatch[1];
                    for (const [assetPath, data] of Object.entries(uploadedAssets)) {
                        const assetFilename = assetPath.split('/').pop();
                        if (urlPath.includes(assetFilename)) {
                            el.style.backgroundImage = `url("${data.blobUrl}")`;
                            break;
                        }
                    }
                }
            });
            const curvesData = Object.entries(uploadedAssets).find(([p]) => p.includes('curves.svg'));
            if (curvesData) {
                let style = doc.getElementById(ASSET_OVERRIDE_STYLE_ID);
                if (!style) { style = doc.createElement('style'); style.id = ASSET_OVERRIDE_STYLE_ID; (doc.head || doc.documentElement).appendChild(style); }
                style.textContent = `:root { --curves-bg-image: url("${curvesData[1].blobUrl}"); --curves-bg-image-dark: url("${curvesData[1].blobUrl}"); }`;
            } else {
                const style = doc.getElementById(ASSET_OVERRIDE_STYLE_ID);
                if (style) style.remove();
            }
        }
        
        function addUploadedAsset(assetPath, file) {

        }
        function updateAssetsInfo() {

        function getExportedValues() {

            for (const [key, item] of Object.entries(config.dark || {})) {

        function saveClientState() {
            const activeClient = getActiveClient();
            if (!activeClient) return;
            const pageSelect = document.getElementById('pageSelect');
            const state = {
                currentTheme: currentTheme,
                selectedPage: pageSelect ? pageSelect.value : 'login.html',
                uploadedCssContent: uploadedCssContent || null,
                values: getExportedValues()
            };
            localStorage.setItem(getClientStateKey(activeClient), JSON.stringify(state));
        }

        function restoreClientState(client) {
            if (!client) return false;
            let state = null;
            try {
                const raw = localStorage.getItem(getClientStateKey(client));
                if (raw) state = JSON.parse(raw);
            } catch (e) {}
            if (!state || !state.values) return false;

            const LEGACY_LIGHT_GRADIENT_KEYS = ['mainGradientStart', 'headerGradient', 'buttonGradient'];
            const LEGACY_DARK_GRADIENT_KEYS = ['mainGradient', 'headerGradient', 'buttonGradient'];
            const gl = state.values.light || {};
            const gd = state.values.dark || {};
            const brandLight = gl.brandGradient || LEGACY_LIGHT_GRADIENT_KEYS.map((k) => gl[k]).find(Boolean);
            const brandDark = gd.brandGradient || LEGACY_DARK_GRADIENT_KEYS.map((k) => gd[k]).find(Boolean);
            if (brandLight && config.light && config.light.brandGradient) {
                setControlValue('light', config.light.brandGradient, brandLight);
            }
            if (brandDark && config.dark && config.dark.brandGradient) {
                setControlValue('dark', config.dark.brandGradient, brandDark);
            }
            Object.entries(gl).forEach(([key, value]) => {
                if (!config.light || !config.light[key] || LEGACY_LIGHT_GRADIENT_KEYS.includes(key)) return;
                setControlValue('light', config.light[key], value);
            });
            Object.entries(gd).forEach(([key, value]) => {
                if (!config.dark || !config.dark[key] || LEGACY_DARK_GRADIENT_KEYS.includes(key)) return;
                setControlValue('dark', config.dark[key], value);
            });

            if (typeof state.uploadedCssContent === 'string' && state.uploadedCssContent.trim()) {
                uploadedCssContent = state.uploadedCssContent;
                const uploadedFileName = document.getElementById('uploadedFileName');
                const clearBtn = document.getElementById('btnClearUploaded');

            document.getElementById('btnLight').classList.toggle('active', theme === 'light');

            applyTheme(theme);
            return true;

  --tertiary-dark: #6B6778;
  --icon-color: #3F3D52;
  --new-login-btn-bg-color-dark: #3F3D52;
}`;

        function exportCss() {
            const { light, dark } = getExportedValues();
            const varRegex = (v) => new RegExp(`(${v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}:\\s*)[^;]+`, 'gs');
            
            const doExport = (css) => {
                let out = css;
                for (const [key, globalVars] of Object.entries(GLOBAL_CSS_MAP.light)) {
                    const val = light[key];
                    if (val && globalVars) globalVars.forEach(v => { out = out.replace(varRegex(v), `$1${val}`); });
                }
                for (const [key, globalVars] of Object.entries(GLOBAL_CSS_MAP.dark)) {
                    const val = dark[key];
                    if (val && globalVars) globalVars.forEach(v => { out = out.replace(varRegex(v), `$1${val}`); });
                }
                /* replace icon color vars in-place (same pattern as main colors above) */
                for (const [cssVar, val] of Object.entries(getIconCssReplacements())) {
                    if (val) out = out.replace(varRegex(cssVar), `$1${val}`);
                }
                const blob = new Blob([out], { type: 'text/css' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'global.css';
                a.click();
                URL.revokeObjectURL(a.href);
            };
            fetch('../assets/css/global.css').then(r => r.text()).then(doExport).catch(() => doExport(GLOBAL_CSS_FALLBACK));
        }
        
        function resetAll() {
            for (const data of Object.values(uploadedAssets)) {
                if (data.blobUrl) URL.revokeObjectURL(data.blobUrl);
            }
            uploadedAssets = {};
            loadConfig().then(() => {
                renderControls();
                document.getElementById('btnLight').classList.add('active');
                document.getElementById('btnDark').classList.remove('active');
                currentTheme = 'light';
                uploadedCssContent = null;
                document.getElementById('uploadedFileName').textContent = '';
                document.getElementById('btnClearUploaded').style.display = 'none';
                document.getElementById('styleFileInput').value = '';
                applyTheme('light');
                if (frame && currentSrc) { frame.src = ''; frame.src = currentSrc; }
            }).catch(() => {
                renderControls();
                document.getElementById('btnLight').classList.add('active');
                document.getElementById('btnDark').classList.remove('active');
                currentTheme = 'light';
                uploadedCssContent = null;
                document.getElementById('uploadedFileName').textContent = '';
                document.getElementById('btnClearUploaded').style.display = 'none';
                document.getElementById('styleFileInput').value = '';
                if (frame && currentSrc) { frame.src = ''; frame.src = currentSrc; }
                applyTheme('light');
            });
        }
        
        document.getElementById('pageSelect').addEventListener('change', (e) => {
            document.getElementById('previewFrame').src = e.target.value;
            document.getElementById('chromeTitle').textContent = e.target.value;
            saveClientState();
        });

        function loadPage(page) {
            const select = document.getElementById('pageSelect');
            const frame  = document.getElementById('previewFrame');
            const title  = document.getElementById('chromeTitle');
            frame.src  = page;
            if (title) title.textContent = page;
            if (select) {
                const opt = select.querySelector(`option[value="${page}"]`);
                if (opt) select.value = page;
            }
        }
        
        document.getElementById('btnLight').addEventListener('click', () => {
            document.getElementById('btnLight').classList.add('active');
            document.getElementById('btnDark').classList.remove('active');
            applyTheme('light');
            saveClientState();
        });
        
        document.getElementById('btnDark').addEventListener('click', () => {
            document.getElementById('btnDark').classList.add('active');
            document.getElementById('btnLight').classList.remove('active');
            applyTheme('dark');
            saveClientState();
        });

        var previewCloseBtn = document.getElementById('previewCloseBtn');
        if (previewCloseBtn) {
            previewCloseBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                closePreviewClearTheme();
            });
            previewCloseBtn.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    closePreviewClearTheme();
                }
            });
        }
        
        /* Resolve var(--xxx) references in a CSS value string using a parsed-vars dictionary */
        function resolveVars(val, parsedVars, depth) {
            if (!val || (depth || 0) > 8) return val;
            return val.replace(/var\(\s*(--[\w-]+)\s*\)/g, function(_, v) {
                const resolved = parsedVars[v];
                return resolved ? resolveVars(resolved.trim(), parsedVars, (depth || 0) + 1) : _;
            });
        }

        /* Parse CSS variable values from uploaded global.css and populate all color picker inputs */
        function importFromCssText(cssText) {
            if (!cssText) return;
            // Extract all --var-name: value pairs from the CSS
            const parsed = {};
            const re = /--([\w-]+)\s*:\s*([^;}\n]+)/g;
            let m;
            while ((m = re.exec(cssText)) !== null) {
                parsed['--' + m[1].trim()] = m[2].trim();
            }
            function populateInputs(cfgEntries, mode) {
                for (const [key, item] of Object.entries(cfgEntries || {})) {
                    if (item.type === 'image') continue;
                    // Try item.var first, then all vars from GLOBAL_CSS_MAP
                    const candidates = [item.var, ...(GLOBAL_CSS_MAP[mode]?.[key] || [])].filter(Boolean);
                    let val = null;
                    for (const v of candidates) { if (parsed[v]) { val = parsed[v].trim(); break; } }
                    if (!val) continue;
                    const wrapper = document.querySelector(`[data-var="${item.var}"][data-mode="${mode}"]`);
                    if (!wrapper) continue;
                    if (item.type === 'gradient') {
                        // Resolve var() references so #hex values are extractable
                        const resolvedVal = resolveVars(val, parsed);
                        const colors = parseGradientColors(resolvedVal);
                        const colorInputs = wrapper.querySelectorAll('input[type="color"]');
                        const textInputs = wrapper.querySelectorAll('.gradient-color-item input[type="text"]');
                        const swatchBgs = wrapper.querySelectorAll('.gradient-color-item .color-swatch-bg');
                        colors.forEach((col, i) => {
                            const h = toHex6(col) || col;
                            if (colorInputs[i]) colorInputs[i].value = h;
                            if (textInputs[i]) textInputs[i].value = h;
                            if (swatchBgs[i] && isHexColor(h)) swatchBgs[i].style.background = h;
                        });
                        const angleMatch = resolvedVal.match(/(\d+(?:\.\d+)?deg)/);
                        if (angleMatch) wrapper.dataset.angle = angleMatch[1];
                    } else {
                        const colorIn = wrapper.querySelector('input[type="color"]');
                        const textIn  = wrapper.querySelector('input[type="text"]');
                        const hex = toHex6(val);
                        if (colorIn && hex) colorIn.value = hex;
                        if (textIn) textIn.value = val;
                    }
                }
            }
            populateInputs(config.light, 'light');
            populateInputs(config.dark,  'dark');
        }

        document.getElementById('btnUploadStyle').addEventListener('click', () => document.getElementById('styleFileInput').click());
        document.getElementById('styleFileInput').addEventListener('change', (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                uploadedCssContent = ev.target?.result || null;
                document.getElementById('uploadedFileName').textContent = 'Loaded: ' + file.name;
                document.getElementById('btnClearUploaded').style.display = 'inline-block';
                importFromCssText(uploadedCssContent);
                applyAllStored();
                saveClientState();
            };
            reader.readAsText(file);
            e.target.value = '';
        });
        document.getElementById('btnClearUploaded').addEventListener('click', () => {
            uploadedCssContent = null;
            document.getElementById('uploadedFileName').textContent = '';
            document.getElementById('btnClearUploaded').style.display = 'none';
            document.getElementById('styleFileInput').value = '';
            renderControls();
            applyAllStored();
            saveClientState();
        });
        
        document.getElementById('btnExportCss').addEventListener('click', exportCss);
        document.getElementById('btnReset').addEventListener('click', () => {
            resetAll();
            setTimeout(saveClientState, 250);
        });

        const activeClientOnLoad = requireClientSession();
        if (activeClientOnLoad) updateClientSessionUi(activeClientOnLoad);
        const logoutBtn = document.getElementById('clientLogoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                localStorage.removeItem(AUTH_STORAGE_KEY);
                localStorage.removeItem('wl-last-login-time');
                window.location.href = '../index.html';
            });
        }
        
        document.getElementById('previewFrame').addEventListener('load', () => {
            applyAllStored(0);
            requestAnimationFrame(() => applyAllStored(0));
            [30, 90, 200, 450].forEach((ms) => setTimeout(() => applyAllStored(0), ms));
            setTimeout(() => applyAllStored(0), 120);
        });
        window.addEventListener('storage', function(e) {
            var logical = window.__wl_physicalKeyToLogical ? window.__wl_physicalKeyToLogical(e.key || '') : (e.key || '');
            if (logical && (logical.indexOf('preview-asset:icon-') === 0 || logical === 'whitelabel-icon-color')) {
                if (logical === 'whitelabel-icon-color') {
                    applyAllStored();
                } else {
                    const frame = document.getElementById('previewFrame');
                    if (frame && frame.src) { frame.src = frame.src; }
                }
            }
        });
        
        loadConfig().then(() => {
            renderControls();
            const restoredClientState = activeClientOnLoad ? restoreClientState(activeClientOnLoad) : false;
            var iconColorFromStorage = localStorage.getItem('whitelabel-icon-color');
            if (iconColorFromStorage && /^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/.test(iconColorFromStorage.trim())) {
                var hex = iconColorFromStorage.trim();
                if (hex.length === 4) hex = '#' + hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3];
                ['light','dark'].forEach(function(m) {
                    var w = document.querySelector('[data-var="--icon-color"][data-mode="' + m + '"]');
                    if (w) {
                        var inp = w.querySelector('input[type="text"]') || w.querySelector('input[type="color"]');
                        if (inp) { inp.value = hex; if (inp.type === 'color') w.querySelector('input[type="text"]').value = hex; }
                    }
                });
            }
            if (!restoredClientState) {
                // Auto-populate swatches from the actual global.css so any saved
                // changes to CSS variables (e.g. --gradient-1-color) are reflected
                // immediately without a manual upload.
                fetch('../assets/css/global.css')
                    .then(function(r) { return r.text(); })
                    .then(function(css) { importFromCssText(css); applyTheme('light'); })
                    .catch(function() { applyTheme('light'); });
            }
            scalePreviewWindow();
            const themePanel = document.querySelector('.theme-panel');
            if (themePanel) {
                themePanel.addEventListener('input', function() {
                    saveClientState();
                });
            }
        });

        /* ─── Auto-fit preview window ─── */
        const PREVIEW_W = 1280, PREVIEW_H = 780, CHROME_H = 36;

        function scalePreviewWindow() {
            const canvas = document.getElementById('previewCanvas');
            const outer  = document.getElementById('previewWindowOuter');
            if (!canvas || !outer) return;
            const pad    = 32;
            const scaleX = (canvas.clientWidth  - pad) / PREVIEW_W;
            const scaleY = (canvas.clientHeight - pad) / (PREVIEW_H + CHROME_H);
            const scale  = Math.max(0.1, Math.min(scaleX, scaleY));
            outer.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', scalePreviewWindow);
        scalePreviewWindow();
    </script>
</body>
</html>
