<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tragofone — mobile communications app" />
    <meta name="theme-color" content="#5834D3" />
    <title>Tragofone</title>

    <script src="js/theme/theme.defaults.js"></script>
    <script src="js/theme/theme.js"></script>
    <script src="js/theme/ThemeManager.js"></script>
    <script src="js/theme/theme-loader.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Nunito+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/wl-studio.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/page.css" />
    <link rel="stylesheet" href="css/image-gallery.css" />
  </head>
  <body>
    <div class="preview-chrome">
      <nav class="screen-nav" aria-label="Screen navigation">
        <label class="screen-nav__label" for="screen-select">Screens</label>
        <select class="screen-nav__select" id="screen-select" name="screen" disabled>
          <option value="splash" selected>Loading screens…</option>
        </select>
      </nav>
      <div class="session-bar" style="display:flex;align-items:center;gap:10px;font-size:12px;width:100%;background:var(--wl-panel,rgba(255,255,255,.05));color:var(--wl-text,#fff);padding:9px 12px;border:1px solid var(--wl-border,rgba(255,255,255,.12));border-radius:var(--wl-radius,12px);backdrop-filter:blur(10px);box-shadow:var(--wl-shadow,0 18px 48px rgba(0,0,0,.35));">
        <span style="opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Signed in as <strong id="wl-client-name" style="color:#8ecae6;">—</strong></span>
        <a href="../choose.html" style="margin-left:auto;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:8px;white-space:nowrap;">Switch</a>
        <button type="button" id="wl-logout-btn" style="cursor:pointer;border:0;background:linear-gradient(135deg,#8ecae6,#b794f6);color:#14152b;font-weight:700;padding:6px 14px;border-radius:8px;font-family:inherit;font-size:12px;white-space:nowrap;">Logout</button>
      </div>
    </div>

    <script>
      (function () {
        var AUTH_STORAGE_KEY = "wl-active-client";
        var client = localStorage.getItem(AUTH_STORAGE_KEY);
        if (!client) {
          window.location.replace("../index.html");
          return;
        }
        document.addEventListener("DOMContentLoaded", function () {
          var nameEl = document.getElementById("wl-client-name");
          if (nameEl) nameEl.textContent = client;
          var btn = document.getElementById("wl-logout-btn");
          if (btn) {
            btn.addEventListener("click", function () {
              localStorage.removeItem(AUTH_STORAGE_KEY);
              localStorage.removeItem("wl-last-login-time");
              window.location.replace("../index.html");
            });
          }
        });
      })();
    </script>

    <div class="preview-shell">
      <div class="device-viewport" id="device-viewport" aria-live="polite"></div>
    </div>

    <script src="node_modules/jszip/dist/jszip.min.js" defer></script>
    <script src="js/assets/export-config.js"></script>
    <script src="js/assets/ios-asset-config.js"></script>
    <script src="js/assets/asset-registry.js" defer></script>
    <script src="js/assets/ios-asset-manager.js" defer></script>
    <script src="js/assets/asset-manager.js" defer></script>
    <script src="js/assets/asset-resolver.js" defer></script>
    <script src="js/assets/export-theme-package.js" defer></script>
    <script src="js/assets/package-export.js" defer></script>
    <script src="js/assets/asset-export.js" defer></script>
    <script src="js/assets/image-gallery.js" defer></script>
    <script src="js/theme/rn-theme-template.js" defer></script>
    <script src="js/theme/export-theme.js" defer></script>
    <script src="js/theme/theme-file-parser.js" defer></script>
    <script src="js/theme/theme-settings.js" defer></script>
    <script src="js/screens-manifest.js"></script>
    <script src="js/screen-loader.js" defer></script>
    <script src="js/screen-nav.js" defer></script>
  </body>
</html>
