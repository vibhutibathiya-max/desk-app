<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        
        .preview-layout { display: flex; height: 100vh; }
        
        .icon-panel {
            width: 360px; min-width: 360px; background: #16213e; border-right: 1px solid #0f3460;
            overflow-y: auto; padding: 16px; flex-shrink: 0;
        }
        .icon-panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8ecae6; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #0f3460; }
        .icon-panel h3 { font-size: 12px; color: #aaa; margin: 12px 0 8px; }
        
        .control-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; min-height: 44px; }
        .control-row label { flex: 0 0 120px; font-size: 12px; color: #e0e0e0; line-height: 1.2; }
        .control-row .color-inputs { display: flex; align-items: center; gap: 8px; flex: 1; }
        .control-row input[type="color"] { width: 56px; height: 48px; min-width: 56px; border: 2px solid #0f3460; cursor: pointer; border-radius: 8px; padding: 3px; background: #0f3460; box-shadow: 0 0 0 1px rgba(255,255,255,0.1); }
        .control-row input[type="color"]:hover { border-color: #8ecae6; }
        .control-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
        .control-row input[type="color"]::-webkit-color-swatch { border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); }
        .control-row input[type="text"] { flex: 1; min-width: 80px; max-width: 120px; padding: 10px 12px; font-size: 13px; background: #0f3460; border: 2px solid #0f3460; color: #fff; border-radius: 6px; }
        .control-row input[type="text"]:focus { outline: none; border-color: #8ecae6; }
        
        .theme-toggle { display: flex; gap: 4px; margin-bottom: 16px; }
        .theme-toggle button { flex: 1; padding: 10px; font-size: 12px; border: 1px solid #0f3460; background: #0f3460; color: #8ecae6; border-radius: 6px; cursor: pointer; }
        .theme-toggle button.active { background: linear-gradient(270deg, #6533e2, #1f97ef); color: #fff; border-color: transparent; }
        
        .section { margin-bottom: 16px; }
        
        .btn { padding: 10px 20px; font-size: 13px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: linear-gradient(270deg, #6533e2, #1f97ef); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: #0f3460; color: #8ecae6; }
        .btn-secondary:hover { background: #1a4a6e; }
        
        input[type="file"] { display: none; }
        
        .preview-section { flex: 1; padding: 24px; overflow-y: auto; background: #0d0d1a; }
        .preview-section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8ecae6; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #0f3460; }
        
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .icon-card {
            background: #16213e; border: 1px solid #0f3460; border-radius: 8px;
            overflow: hidden; transition: border-color 0.2s;
        }
        .icon-card:hover { border-color: #8ecae6; }
        
        .icon-preview-row { display: flex; min-height: 90px; }
        .icon-preview-swatch {
            flex: 1; padding: 12px; display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid #0f3460;
        }
        .icon-preview-swatch.light { background: #f5f5f5; }
        .icon-preview-swatch.dark { background: #0d0d1a; border-left: 1px solid #0f3460; }
        .icon-preview-swatch img { max-width: 156px; height: 156px; object-fit: contain; }
        
        .icon-info { padding: 12px 16px; font-size: 12px; color: #e0e0e0; }
        .icon-info .name { font-weight: 600; color: #fff; margin-bottom: 4px; word-break: break-all; }
        .icon-info .icon-preview-link {
            font-size: 11px; color: #57a1d7; text-decoration: none; display: inline-block; margin-bottom: 8px;
        }
        .icon-info .icon-preview-link:hover { text-decoration: underline; color: #8ecae6; }
        
        .icon-colors { margin-top: 10px; padding-top: 10px; border-top: 1px solid #0f3460; }
        .icon-colors summary { cursor: pointer; color: #8ecae6; font-size: 11px; }
        .icon-colors summary:hover { text-decoration: underline; }
        .icon-colors[open] summary { margin-bottom: 8px; }
        .color-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; }
        .color-row label { flex: 0 0 90px; color: #aaa; }
        .color-swatch-wrap { position: relative; display: block; flex-shrink: 0; width: 40px; height: 36px; cursor: pointer; border-radius: 6px; overflow: hidden; border: 2px solid #0f3460; }
        .color-swatch-wrap:hover { border-color: #8ecae6; }
        .color-swatch-wrap .color-swatch-bg { position: absolute; inset: 0; border-radius: 4px; }
        .color-swatch-wrap input[type="color"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; padding: 0; border: none; }
        .color-row input[type="text"] { flex: 1; min-width: 0; padding: 6px 8px; font-size: 11px; background: #0f3460; border: 1px solid #0f3460; color: #fff; border-radius: 4px; }
        .color-row .var-tag { font-size: 9px; color: #666; }
        
        .icon-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .icon-actions .btn { padding: 6px 12px; font-size: 11px; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .empty-state p { margin-top: 12px; font-size: 14px; }
        
        .no-colors-hint { font-size: 10px; color: #666; margin-top: 6px; }
        .icon-card.shared-gradient-card { grid-column: 1 / -1; width: 100%; }
        .preview-area { flex: 1; overflow-y: auto; background: #0d0d1a; display: flex; flex-direction: column; }
        .preview-area .header-bar {
            background: #16213e; border-bottom: 1px solid #0f3460;
            padding: 16px 24px; flex-shrink: 0; display: flex; align-items: center; gap: 16px;
        }
        .preview-area .header-bar h1 { font-size: 18px; color: #8ecae6; font-weight: 600; }
        .shared-preview-strip {
            display: flex; flex-direction: row; flex-wrap: wrap; gap: 20px 24px;
            margin-bottom: 24px; padding: 20px 0; width: 100%;
        }
        .shared-icon-cell {
            flex: 1 1 calc(20% - 20px); min-width: 140px; display: flex; flex-direction: column; gap: 10px; padding: 16px;
            background: #0f3460; border-radius: 8px; border: 1px solid #1a4a6e;
        }
        .shared-icon-cell .icon-name { font-size: 11px; color: #8ecae6; word-break: break-all; text-align: center; font-weight: 500; }
        .shared-icon-cell .icon-preview-link {
            font-size: 10px; color: #57a1d7; text-decoration: none; display: block; text-align: center; margin-top: 6px;
        }
        .shared-icon-cell .icon-preview-link:hover { text-decoration: underline; color: #8ecae6; }
        .shared-icon-cell .preview-pair {
            display: flex; gap: 10px; align-items: stretch; min-height: 140px;
        }
        .shared-icon-cell .preview-pair .mini-preview {
            flex: 1; min-width: 70px; min-height: 140px; height: 140px; border-radius: 6px; overflow: hidden; border: 1px solid #1a4a6e;
            display: flex; align-items: center; justify-content: center;
        }
        .shared-icon-cell .preview-pair .mini-preview img,
        .shared-icon-cell .preview-pair .mini-preview .inline-svg-wrap { max-width: 100%; max-height: 100%; object-fit: contain; }
        .shared-icon-cell .preview-pair .mini-preview .inline-svg-wrap { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .shared-icon-cell .preview-pair .mini-preview .inline-svg-wrap svg { max-width: 100%; max-height: 100%; }
        .shared-icon-cell .preview-pair .mini-preview.light { background: #f5f5f5; }
        .shared-icon-cell .preview-pair .mini-preview.dark { background: #0d0d1a; }
        .icon-card.shared-gradient-card .icon-info { padding: 16px 20px; }
        .shared-colors-columns { display: flex; gap: 24px; margin-top: 16px; flex-wrap: wrap; }
        .shared-colors-column { flex: 1; min-width: 280px; padding: 16px; border-radius: 8px; border: 2px solid; }
        .shared-colors-column.light-col {
            background: linear-gradient(135deg, rgba(245,245,245,0.15) 0%, rgba(230,230,230,0.08) 100%);
            border-color: #4a90a4;
        }
        .shared-colors-column.light-col h4 { color: #2c5f6f; background: #e8f4f8; }
        .shared-colors-column.dark-col {
            background: linear-gradient(135deg, rgba(26,26,46,0.6) 0%, rgba(13,13,26,0.8) 100%);
            border-color: #3d3d5c;
        }
        .shared-colors-column.dark-col h4 { color: #b8b8d0; background: #252540; }
        .shared-colors-column h4 {
            font-size: 14px; font-weight: 600; margin: -16px -16px 16px -16px; padding: 12px 16px; border-radius: 6px 6px 0 0;
            display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .shared-colors-column h4::before { content: ''; width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
        .shared-colors-column.light-col h4::before { background: #ffd93d; box-shadow: 0 0 8px rgba(255,217,61,0.5); }
        .shared-colors-column.dark-col h4::before { background: #4a4a6e; box-shadow: 0 0 8px rgba(74,74,110,0.5); }
    </style>
</head>
<body>
    <div class="preview-layout">
        <aside class="icon-panel">
            <h2>Icon Colors</h2>
            <a href="whitelabel-preview.html" class="btn btn-primary" style="display:inline-flex;align-items:center;text-decoration:none;margin-bottom:16px;width:100%;justify-content:center">White-Label Preview</a>
            
            <label style="font-size:12px;color:#aaa;display:block;margin-bottom:4px">Theme Mode</label>
            <div class="theme-toggle">
                <button type="button" id="btnLight" class="active">Light</button>
                <button type="button" id="btnDark">Dark</button>
            </div>
            
            <div id="lightColorsSection" class="section">
                <h3>Light mode — changes light-theme icons</h3>
                <div id="lightColors" class="icon-colors"></div>
            </div>
            
            <div id="darkColorsSection" class="section" style="display:none">
                <h3>Dark mode — changes dark-theme icons</h3>
                <div id="darkColors" class="icon-colors"></div>
            </div>
            
            <div class="section">
                <button class="btn btn-secondary" id="btnClearAll" style="width:100%;margin-bottom:8px" title="Clear overrides for all 18">Clear All</button>
                <button class="btn btn-primary" id="btnDownloadIcons" style="width:100%;margin-bottom:8px">Download Icons (icon.zip)</button>
                <button class="btn btn-secondary" id="btnResetAll" style="width:100%">Reset All</button>
            </div>
        </aside>
        
        <div class="preview-area">
            <header class="header-bar">
                <h1>Icon Gallery</h1>
            </header>
            
            <script src="../assets/js/jszip.js"></script>
            <section class="preview-section">
          
            <div id="iconGrid" class="icon-grid"></div>
            <div id="emptyState" class="empty-state">
                <p>Loading icons…</p>
            </div>
        </section>
        </div>
    </div>
    
    <script>
        const ICON_FILES = [
            'done.svg', 'logout.svg', 'autoStartup.svg', 'blind-trasferred.svg', 're-register.svg',
            'clear-history.svg', 'web-socket-connection.svg',
            'api-test-connection.svg',
            'no-calls-found.svg', 'no-favoritecontact-found.svg',
            'qr-vector.svg', 'check-mail.svg', 'cloud-contact-banner.svg', 'start-chat.svg', 'no-contacts-found.svg'
        ];
        const SHARED_GRADIENT_ICONS = ICON_FILES;
        /** Hex colors to exclude from customization (fixed in SVG, rest remain changeable) */
        const EXCLUDED_PURPLE_GRADIENT = ['#311944', '#361a47', '#46204f', '#4a2252', '#5c285c', '#893976', '#361b47', '#462050', '#602a5f', '#843773'];
        /** Colors used in 2+ icons – define once, change reflects everywhere */
        const EXCLUDED_SHARED = ['#D9D9D9', '#80C9FF', '#00B4FF', '#57A1D7', '#F8A99C', '#231F20', '#2B2933', '#95B0DC', '#E1EDFF'];
        /** Icons that use hex in SVG (not CSS vars) – need applySvgColors in shared strip */
        const ICONS_USING_HEX = ['no-calls-found.svg', 'no-favoritecontact-found.svg', 'qr-vector.svg', 'cloud-contact-banner.svg', 'start-chat.svg', 'no-contacts-found.svg'];
        /** These 7 icons use shared vars; dark mode uses SAME colors as light (not separate dark grays) */
        const ICONS_SAME_LIGHT_DARK = ['no-calls-found.svg', 'no-favoritecontact-found.svg', 'qr-vector.svg', 'check-mail.svg', 'cloud-contact-banner.svg', 'start-chat.svg', 'no-contacts-found.svg'];
        const ICONS_WITH_LIGHT_DARK_COLUMNS = [];
        const EXCLUDED_COLORS_BY_ICON = {
            'no-calls-found.svg': EXCLUDED_PURPLE_GRADIENT,
            'no-favoritecontact-found.svg': [...EXCLUDED_PURPLE_GRADIENT, ...EXCLUDED_SHARED],
            'qr-vector.svg': [...EXCLUDED_PURPLE_GRADIENT, ...EXCLUDED_SHARED, '#35A2DB'],
            'check-mail.svg': [...EXCLUDED_SHARED, '#DADADA', '#F6F5F5', '#102048', '#F4EFFF', '#ADC3FF', '#86A7FF', '#7760B0', '#5B4DAD', '#26AB23', '#4E9AD2', '#F9B384', '#EB5D60', '#6837E2', '#4C17D1', '#E28B6D', '#3683BC', '#1F3C88', '#FBB81D', '#FBC343', '#32274F', '#FFFFFF'],
            'cloud-contact-banner.svg': [...EXCLUDED_PURPLE_GRADIENT, ...EXCLUDED_SHARED, '#34A853', '#FBBC05', '#EB4335', '#4285F4', '#009CDA'],
            'start-chat.svg': [...EXCLUDED_PURPLE_GRADIENT, ...EXCLUDED_SHARED, '#6837E2'],
            'no-contacts-found.svg': [...EXCLUDED_PURPLE_GRADIENT, ...EXCLUDED_SHARED, '#15181A']
        };
        /** Light mode – all 7 inputs affect light theme icons (17 icons share these) */
        const SHARED_COLORS_LIGHT = [
            { id: '#6533E2', label: 'Gradient 1', default: '#6533E2', replace: ['#6533E2', '#6837E2'] },
            { id: '#7349DE', label: 'Gradient 2', default: '#7349DE' },
            { id: '#1F97EF', label: 'Gradient 3', default: '#1F97EF' },
            { id: '#57A1D7', label: 'Gradient 4', default: '#57A1D7' },
            { id: '#E8DFFF', label: 'Bg circle / Body', default: '#E8DFFF' },
            { id: '#614B98', label: 'Primary', default: '#614B98', replace: ['#614B98', '#7760B0'] },
            { id: '#CEBBFF', label: 'Badge (check-mail)', default: '#CEBBFF' }
        ];
        /** Dark mode – all inputs affect dark theme icons */
        const SHARED_COLORS_DARK = [
            { id: '#D9D9D9', label: 'Icon stroke + Bg done', default: '#D9D9D9' },
            { id: '#BDBBC4', label: 'Bg websocket secondary', default: '#BDBBC4' }
        ];
        /** For getIconColorConfig (shared icons use resolveSvgVars, not applySvgColors) */
        const SHARED_GRADIENT_COLORS_LIGHT = SHARED_COLORS_LIGHT;
        const SHARED_GRADIENT_COLORS_DARK = SHARED_COLORS_DARK;
        /** Combined for getSharedPreviewVars lookup */
        const SHARED_GRADIENT_COLORS = [...SHARED_COLORS_LIGHT, ...SHARED_COLORS_DARK];
        const SHARED_GRADIENT_KEY = 'shared-gradient';
        const ICON_PATH_LIGHT = '../public/app-icon/icon/light/';
        const ICON_PATH_DARK = '../public/app-icon/icon/dark/';
        /** Fallback when themed light/dark copies are missing (e.g. design bundle only has one asset) */
        const ICON_IMG_NEW = '../assets/img-new/';
        function iconSourceUrlsForFetch(filename, mode) {
            const path = mode === 'light' ? ICON_PATH_LIGHT : ICON_PATH_DARK;
            const urls = [path + filename];
            if (filename === 'check-mail.svg') urls.push(ICON_IMG_NEW + filename);
            return urls;
        }
        const PREVIEW_PREFIX_LIGHT = 'preview-asset:icon-light:';
        const PREVIEW_PREFIX_DARK = 'preview-asset:icon-dark:';
        const COLORS_PREFIX = 'whitelabel-icon-colors:';
        
        /** Icon → page where it appears. Preview link opens this so user sees icon in context. */
        const ICON_TO_PAGE = {
            'done.svg': 'setting.html#pills-testConnection',
            'logout.svg': 'setting.html#logoutModal',
            'autoStartup.svg': 'autostartup.html',
            'blind-trasferred.svg': 'call_connecting.html#blindTransferModal',
            're-register.svg': 'setting.html#pills-reRegister',
            'clear-history.svg': 'clearhostory.html#allCall',
            'web-socket-connection.svg': 'setting.html#pills-debuggingLogs',
            'api-test-connection.svg': 'setting.html#pills-debuggingLogs',
            'no-calls-found.svg': 'call_history.html',
            'no-favoritecontact-found.svg': 'nofvcontactfound.html',
            'qr-vector.svg': 'qrcode.html',
            'check-mail.svg': 'checkmail.html',
            'cloud-contact-banner.svg': 'contact.html',
            'start-chat.svg': 'startchat.html',
            'no-contacts-found.svg': 'nofvcontactfound.html'
        };
        function getIconPreviewHref(filename) {
            return ICON_TO_PAGE[filename] || 'setting.html';
        }

        let icons = [];
        const svgCache = {};
        const colorConfigCache = {};
        
        function toHex6(hex) {
            if (!hex || !/^#?([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/.test(String(hex).trim())) return null;
            let h = String(hex).trim().replace(/^#/, '');
            if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
            return '#' + h.toLowerCase();
        }
        /** For input[type="color"]: value must be #rrggbb lowercase. Returns valid value or fallback. */
        function toColorInputValue(hex, fallback) {
            const v = toHex6(hex);
            return (v && /^#[0-9a-f]{6}$/.test(v)) ? v : (toHex6(fallback) || '#000000');
        }
        
        /** Build CSS variable style strings for shared preview (light/dark) from stored color values.
         * Follows global/light/dark.css pattern: set source vars (--xxx-light / --xxx-dark) then consumption vars (--xxx: var(--xxx-light)).
         * light.css: --icon-gradient-1: var(--icon-gradient-1-light); dark.css: --icon-gradient-1: var(--icon-fg-dark); */
        function getSharedPreviewVars(colorValues) {
            const lookup = (id) => {
                const k = Object.keys(colorValues || {}).find(x => x.toLowerCase() === id.toLowerCase());
                return k ? colorValues[k] : undefined;
            };
            const def = (id) => toHex6(lookup(id)) || SHARED_GRADIENT_COLORS.find(c => c.id.toLowerCase() === id.toLowerCase())?.default || id;
            const g1 = def('#6533E2'), g2 = def('#7349DE'), g3 = def('#1F97EF'), g4 = def('#57A1D7');
            const bgDone = def('#E8DFFF'), bgWs = def('#614B98'), badge = def('#CEBBFF'), fgDark = def('#D9D9D9'), bgWsDark = def('#BDBBC4');
            const light = [
                '--icon-gradient-1-light:' + g1, '--icon-gradient-2-light:' + g2, '--icon-gradient-3-light:' + g3, '--icon-gradient-4-light:' + g4,
                '--icon-bg-done-light:' + bgDone, '--icon-bg-websocket-light:' + bgWs, '--icon-badge-light:' + badge,
                '--icon-gradient-1:var(--icon-gradient-1-light)', '--icon-gradient-2:var(--icon-gradient-2-light)', '--icon-gradient-3:var(--icon-gradient-3-light)', '--icon-gradient-4:var(--icon-gradient-4-light)',
                '--icon-bg-done:var(--icon-bg-done-light)', '--icon-bg-websocket:var(--icon-bg-websocket-light)',
                '--icon-primary:var(--icon-bg-websocket-light)', '--icon-body:var(--icon-bg-done-light)', '--icon-badge:var(--icon-badge-light)'
            ].join(';');
            const dark = [
                '--icon-fg-dark:' + fgDark, '--icon-bg-done-dark:' + fgDark, '--icon-bg-websocket-dark:' + bgWsDark,
                '--icon-gradient-1:var(--icon-fg-dark)', '--icon-gradient-2:var(--icon-fg-dark)', '--icon-gradient-3:var(--icon-fg-dark)', '--icon-gradient-4:var(--icon-fg-dark)',
                '--icon-bg-done:var(--icon-bg-done-dark)', '--icon-bg-websocket:var(--icon-bg-websocket-dark)'
            ].join(';');
            return { light, dark };
        }

        function getStoredColors(filename, mode) {
            if (SHARED_GRADIENT_ICONS.includes(filename)) {
                const key = SHARED_GRADIENT_KEY;
                try {
                    const raw = localStorage.getItem(COLORS_PREFIX + key);
                    if (!raw) return {};
                    const parsed = JSON.parse(raw);
                    return typeof parsed === 'object' && parsed !== null ? parsed : {};
                } catch (e) { return {}; }
            }
            const key = mode && ICONS_WITH_LIGHT_DARK_COLUMNS.includes(filename) ? filename + ':' + mode : filename;
            try {
                const raw = localStorage.getItem(COLORS_PREFIX + key);
                if (!raw) return {};
                const parsed = JSON.parse(raw);
                return typeof parsed === 'object' && parsed !== null ? parsed : {};
            } catch (e) { return {}; }
        }
        
        var deskAppIconBridge = null;
        function broadcastIconColorsToOtherWindows() {
            try {
                if (typeof BroadcastChannel === 'function') {
                    if (!deskAppIconBridge) deskAppIconBridge = new BroadcastChannel('desk-app-icon-bridge');
                    deskAppIconBridge.postMessage({ t: 'shared-colors' });
                }
            } catch (e) { /* */ }
        }
        function setStoredColors(filename, obj, mode) {
            if (SHARED_GRADIENT_ICONS.includes(filename)) {
                localStorage.setItem(COLORS_PREFIX + SHARED_GRADIENT_KEY, JSON.stringify(obj));
            } else {
                const key = mode && ICONS_WITH_LIGHT_DARK_COLUMNS.includes(filename) ? filename + ':' + mode : filename;
                localStorage.setItem(COLORS_PREFIX + key, JSON.stringify(obj));
            }
            window.dispatchEvent(new CustomEvent('whitelabel-icon-colors-changed'));
            broadcastIconColorsToOtherWindows();
        }
        
        /** Extract unique hex colors from SVG. One box per icon, one control per color – no repeats. */
        function parseSvgColors(svgText) {
            const byHex = new Map();
            function add(hex) {
                const h = toHex6(hex);
                if (!h || byHex.has(h.toLowerCase())) return;
                byHex.set(h.toLowerCase(), { id: h, default: h });
            }
            const stopRe = /stop-color\s*=\s*["']?#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})(?![0-9A-Fa-f])/gi;
            let m;
            while ((m = stopRe.exec(svgText)) !== null) add('#' + m[1]);
            const fillRe = /fill\s*=\s*["']#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})(?![0-9A-Fa-f])/gi;
            while ((m = fillRe.exec(svgText)) !== null) add('#' + m[1]);
            const strokeRe = /stroke\s*=\s*["']#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})(?![0-9A-Fa-f])/gi;
            while ((m = strokeRe.exec(svgText)) !== null) add('#' + m[1]);
            if (byHex.size === 0) return null;
            const colors = Array.from(byHex.values()).map((c, i) => ({
                id: c.id,
                label: 'Color ' + (i + 1) + ' ' + c.default,
                default: c.default,
                replace: [c.default]
            }));
            return { colors };
        }
        
        function getColorValue(colorValues, slotId) {
            if (colorValues[slotId] !== undefined && colorValues[slotId] !== null) return colorValues[slotId];
            const lower = String(slotId).toLowerCase();
            for (const k of Object.keys(colorValues || {})) {
                if (String(k).toLowerCase() === lower) return colorValues[k];
            }
            return undefined;
        }
        
        function applySvgColors(svgText, colorConfig, colorValues) {
            if (!svgText || !colorConfig?.colors) return svgText;
            let out = svgText;
            colorConfig.colors.forEach(slot => {
                const val = getColorValue(colorValues, slot.id);
                const hex = val ? toHex6(val) : toHex6(slot.default);
                if (!hex) return;
                const toReplace = slot.replace || [slot.id];
                toReplace.forEach(oldHex => {
                    const escaped = String(oldHex).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const re = new RegExp(escaped, 'gi');

                }

        function getReplacePatterns(hexId) {
            const h = String(hexId);
            const lower = h.toLowerCase();

        }
        
        async function getIconColorConfig(filename, mode) {
            if (SHARED_GRADIENT_ICONS.includes(filename)) {
                const useLight = mode === 'light' || ICONS_SAME_LIGHT_DARK.includes(filename);
                const modeColors = useLight ? SHARED_GRADIENT_COLORS_LIGHT : SHARED_GRADIENT_COLORS_DARK;
                return { colors: modeColors.map(c => ({ ...c, replace: c.replace || getReplacePatterns(c.id) })) };
            }
            const cacheKey = filename + ':' + mode;
            if (colorConfigCache[cacheKey]) return colorConfigCache[cacheKey];
            const prefix = mode === 'light' ? PREVIEW_PREFIX_LIGHT : PREVIEW_PREFIX_DARK;
            const stored = localStorage.getItem(prefix + filename);
            let svgText = '';
            if (stored && stored.startsWith('data:')) {

                const excluded = new Set((EXCLUDED_COLORS_BY_ICON[filename] || []).map(h => (toHex6(h) || '').toLowerCase()).filter(Boolean));
                config = { colors: config.colors.filter(c => {
                    const key = (toHex6(c.id) || String(c.id || '')).toLowerCase();
                    return !key || !excluded.has(key);
                }) };
            }
            colorConfigCache[cacheKey] = config;
            return config;
        }
        
        async function getPreviewUrl(filename, mode, colorValues) {
            const prefix = mode === 'light' ? PREVIEW_PREFIX_LIGHT : PREVIEW_PREFIX_DARK;
            const stored = localStorage.getItem(prefix + filename);
            if (stored && stored.startsWith('data:')) return stored;
            const urls = iconSourceUrlsForFetch(filename, mode);
            let url = urls[0];
            let svgText = '';
            for (const u of urls) {
                url = u;
                svgText = await fetchSvgText(u);

        }
        
        function getDefaults(config) {
            const o = {};

        }
        
        function addIcon(data) {

        function loadOneIcon(filename, mode, onDone) {

        }

            });
            setStoredColors(SHARED_GRADIENT_ICONS[0], {});
            scheduleRenderGrid();
        });
        
        document.getElementById('btnResetAll').addEventListener('click', () => {
            icons.forEach(i => {
                if (i?.lightSrc?.startsWith('blob:')) URL.revokeObjectURL(i.lightSrc);
                if (i?.darkSrc?.startsWith('blob:')) URL.revokeObjectURL(i.darkSrc);
            });
            Object.keys(colorConfigCache).forEach(k => delete colorConfigCache[k]);
            ICON_FILES.forEach(f => {
                localStorage.removeItem(PREVIEW_PREFIX_LIGHT + f);
                localStorage.removeItem(PREVIEW_PREFIX_DARK + f);
            });
            setStoredColors(SHARED_GRADIENT_ICONS[0], {});
            icons = [];
            loadBuiltInIcons();
        });
        
        function dataUrlToBinary(dataUrl) {
            if (!dataUrl || !dataUrl.startsWith('data:')) return null;
            const comma = dataUrl.indexOf(',');
            if (comma < 0) return null;
            const header = dataUrl.slice(0, comma);
            const payload = dataUrl.slice(comma + 1);
            if (header.includes('base64')) {
                try {
                    const binary = atob(payload);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    return bytes;
                } catch (e) { return null; }
            }
            try { return new TextEncoder().encode(decodeURIComponent(payload)); } catch (e) { return null; }
        }
        
        function dataUrlToSvgText(dataUrl) {
            if (!dataUrl || !dataUrl.startsWith('data:')) return '';
            const comma = dataUrl.indexOf(',');
            if (comma < 0) return '';
            const payload = dataUrl.slice(comma + 1);
            const header = dataUrl.slice(0, comma);
            if (header.includes('base64')) {
                try {
                    const bin = atob(payload);
                    const bytes = new Uint8Array(bin.length);
                    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    return new TextDecoder().decode(bytes);
                } catch (e) { return ''; }
            }
            try { return decodeURIComponent(payload); } catch (e) { return ''; }
        }
        
        async function getSvgWithColors(filename, mode) {
            const prefix = mode === 'light' ? PREVIEW_PREFIX_LIGHT : PREVIEW_PREFIX_DARK;
            const stored = localStorage.getItem(prefix + filename);
            if (stored && stored.startsWith('data:')) {
                const txt = dataUrlToSvgText(stored);
                if (txt) return txt;
            }
            return await fetchSvgTextFirstOf(iconSourceUrlsForFetch(filename, mode));
        }

        /** Replace var(--icon-*) in SVG text with actual hex values from shared color storage */
        function resolveSvgVars(svgText, mode) {
            if (!svgText || !svgText.includes('var(--icon-')) return svgText;
            const stored = getStoredColors(SHARED_GRADIENT_ICONS[0]);
            const def = (id) => toHex6(stored[id]) || SHARED_GRADIENT_COLORS.find(c => c.id.toLowerCase() === id.toLowerCase())?.default || '#000000';
            const p = def('#614B98'), b = def('#E8DFFF'), badge = def('#CEBBFF');
            const lightMap = {
                'var(--icon-gradient-1)': def('#6533E2'),
                'var(--icon-gradient-2)': def('#7349DE'),
                'var(--icon-gradient-3)': def('#1F97EF'),
                'var(--icon-gradient-4)': def('#57A1D7'),
                'var(--icon-bg-done)': b,
                'var(--icon-bg-websocket)': p,
                'var(--icon-primary, #614B98)': p,
                'var(--icon-primary, #7760B0)': p,
                'var(--icon-body, #E8DFFF)': b,
                'var(--icon-badge, #CEBBFF)': badge
            };
            const darkMap = {
                'var(--icon-fg-dark)': def('#D9D9D9'),
                'var(--icon-bg-done)': def('#D9D9D9'),
                'var(--icon-bg-websocket)': def('#BDBBC4'),
                'var(--icon-primary, #614B98)': def('#614B98'),
                'var(--icon-primary, #7760B0)': def('#614B98'),
                'var(--icon-body, #E8DFFF)': def('#E8DFFF'),
                'var(--icon-badge, #CEBBFF)': def('#CEBBFF'),
                'var(--icon-gradient-1)': def('#D9D9D9'),
                'var(--icon-gradient-2)': def('#D9D9D9'),
                'var(--icon-gradient-3)': def('#D9D9D9'),
                'var(--icon-gradient-4)': def('#D9D9D9')
            };
            const map = mode === 'light' ? lightMap : darkMap;
            let out = svgText;
            for (const [k, v] of Object.entries(map)) out = out.split(k).join(v);
            return out;
        }
        
        async function downloadIconZip() {
            if (typeof JSZip === 'undefined') { alert('JSZip not loaded'); return; }
            const zip = new JSZip();
            const lightFolder = zip.folder('public/app-icon/icon/light');
            const darkFolder = zip.folder('public/app-icon/icon/dark');
            for (const filename of ICON_FILES) {
                const prefixL = PREVIEW_PREFIX_LIGHT + filename;
                const prefixD = PREVIEW_PREFIX_DARK + filename;
                const storedL = localStorage.getItem(prefixL);
                const storedD = localStorage.getItem(prefixD);
                let lightSvg = '', darkSvg = '';
                if (storedL && storedL.startsWith('data:')) lightSvg = dataUrlToSvgText(storedL);
                if (storedD && storedD.startsWith('data:')) darkSvg = dataUrlToSvgText(storedD);
                if (!lightSvg) lightSvg = await getSvgWithColors(filename, 'light');
                if (!darkSvg) darkSvg = await getSvgWithColors(filename, 'dark');
                const colorValuesLight = getStoredColors(SHARED_GRADIENT_ICONS[0]);
                const colorValuesDark = colorValuesLight;
                const sharedVals = { ...getDefaults({ colors: SHARED_COLORS_LIGHT }), ...getDefaults({ colors: SHARED_COLORS_DARK }), ...colorValuesLight, ...colorValuesDark };
                const sharedConfigLight = { colors: SHARED_COLORS_LIGHT.map(c => ({ ...c, replace: c.replace || getReplacePatterns(c.id) })) };
                const sharedConfigDark = { colors: SHARED_COLORS_DARK.map(c => ({ ...c, replace: c.replace || getReplacePatterns(c.id) })) };
                if (ICONS_USING_HEX.includes(filename)) {
                    if (lightSvg) lightSvg = applySvgColors(lightSvg, sharedConfigLight, sharedVals);
                    if (darkSvg) darkSvg = applySvgColors(darkSvg, sharedConfigLight, sharedVals);
                } else {
                    lightSvg = resolveSvgVars(lightSvg, 'light');
                    darkSvg = resolveSvgVars(darkSvg, ICONS_SAME_LIGHT_DARK.includes(filename) ? 'light' : 'dark');
                }
                if (lightSvg) lightFolder.file(filename, lightSvg);
                if (darkSvg) darkFolder.file(filename, darkSvg);
            }
            const blob = await zip.generateAsync({ type: 'blob' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'icon.zip';
            a.click();
            URL.revokeObjectURL(a.href);
        }
        
        document.getElementById('btnDownloadIcons').addEventListener('click', downloadIconZip);
        
        let livePreviewReloadTimer = 0;
        function scheduleLivePreviewReload() {
            if (livePreviewReloadTimer) clearTimeout(livePreviewReloadTimer);
            livePreviewReloadTimer = setTimeout(() => {
                livePreviewReloadTimer = 0;
                const frame = document.getElementById('livePreviewFrame');
                if (frame && frame.src) frame.src = frame.src;
            }, 400);
        }
        function updateLivePreviewSrc() {
            const page = document.getElementById('livePreviewPage')?.value || 'setting.html';
            const frame = document.getElementById('livePreviewFrame');
            if (!frame) return;
            frame.src = page;
        }
        document.getElementById('livePreviewPage')?.addEventListener('change', updateLivePreviewSrc);
        
        document.getElementById('btnLight')?.addEventListener('click', () => {
            document.getElementById('btnLight')?.classList.add('active');
            document.getElementById('btnDark')?.classList.remove('active');
            const light = document.getElementById('lightColorsSection');
            const dark = document.getElementById('darkColorsSection');
            if (light) light.style.display = '';
            if (dark) dark.style.display = 'none';
        });
        document.getElementById('btnDark')?.addEventListener('click', () => {
            document.getElementById('btnDark')?.classList.add('active');
            document.getElementById('btnLight')?.classList.remove('active');
            const light = document.getElementById('lightColorsSection');
            const dark = document.getElementById('darkColorsSection');
            if (light) light.style.display = 'none';
            if (dark) dark.style.display = '';
        });
        
        loadBuiltInIcons();
    </script>
